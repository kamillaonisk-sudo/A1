<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil Instagram</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --text-secondary: #737373;
    --border: #dbdbdb;
    --btn-bg: #efefef;
    --btn-bg-hover: #dbdbdb;
    --link: #00376b;
    --blue: #0095f6;
    --blue-hover: #1877f2;
    --avatar-bg: #dbdbdb;
    --avatar-fg: #ffffff;
    --placeholder: #efefef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --text: #f5f5f5;
      --text-secondary: #a8a8a8;
      --border: #262626;
      --btn-bg: #363636;
      --btn-bg-hover: #262626;
      --link: #e0f1ff;
      --blue: #0095f6;
      --blue-hover: #4cb5f9;
      --avatar-bg: #262626;
      --avatar-fg: #737373;
      --placeholder: #121212;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 18px;
    overflow-y: scroll;
  }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  /* ---------- Page ---------- */
  main {
    max-width: 935px;
    margin: 0 auto;
    padding: 30px 20px 0;
  }

  /* ---------- Header ---------- */
  .profile {
    display: flex;
    align-items: stretch;
    margin-bottom: 44px;
  }
  .profile-avatar {
    flex: 1 0 0;
    display: flex;
    justify-content: center;
    margin-right: 30px;
  }
  .avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--avatar-bg);
    flex-shrink: 0;
  }
  .avatar svg { width: 100%; height: 100%; display: block; }

  .profile-info {
    flex: 2 0 0;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .row-username {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .username {
    font-size: 20px;
    line-height: 25px;
    font-weight: 400;
    margin-right: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn {
    height: 32px;
    padding: 0 16px;
    border-radius: 8px;
    background: var(--btn-bg);
    font-size: 14px;
    font-weight: 600;
    line-height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    transition: background-color .1s;
  }
  .btn:hover { background: var(--btn-bg-hover); }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-hover); }
  .btn-icon { width: 32px; padding: 0; background: none; }
  .btn-icon:hover { background: none; opacity: .5; }

  .stats {
    display: flex;
    list-style: none;
    margin-bottom: 20px;
    font-size: 16px;
    line-height: 20px;
  }
  .stats li { margin-right: 40px; white-space: nowrap; }
  .stats li:last-child { margin-right: 0; }
  .stats b { font-weight: 600; }
  .stats .label { color: var(--text-secondary); }

  .bio-name { font-weight: 600; }
  .bio-category { color: var(--text-secondary); }
  .bio-text { white-space: pre-line; }
  .bio-link { color: var(--link); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .bio-link:hover { text-decoration: underline; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 60px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 52px;
    margin-top: -1px;
    border-top: 1px solid transparent;
    color: var(--text-secondary);
  }
  .tab.active { color: var(--text); border-top-color: var(--text); }
  .tab svg { width: 12px; height: 12px; }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding-bottom: 40px;
  }
  .grid:empty { display: none; }

  .post {
    position: relative;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: var(--placeholder);
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
  }
  .post:active { cursor: grabbing; }
  .post img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    pointer-events: none;
  }
  .post-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
  }
  .post:hover .post-overlay { opacity: 1; }
  .post-overlay span { display: inline-flex; align-items: center; gap: 7px; }
  .post-overlay svg { width: 19px; height: 19px; }

  .post.dragging { opacity: .35; }
  .grid.is-dragging .post:hover .post-overlay { opacity: 0; }

  /* ---------- Empty state ---------- */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 60px 44px;
  }
  .empty[hidden] { display: none; }
  .empty-icon {
    width: 62px;
    height: 62px;
    border: 2px solid var(--text);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .empty-icon svg { width: 24px; height: 24px; }
  .empty h2 { font-size: 30px; line-height: 36px; font-weight: 800; margin-bottom: 24px; }
  .empty p { margin-bottom: 24px; }
  .empty button { color: var(--blue); font-weight: 600; }
  .empty button:hover { color: var(--link); }

  #file-input { display: none; }

  /* ---------- Mobile ---------- */
  @media (max-width: 735px) {
    main { padding: 0; }
    .profile {
      display: grid;
      grid-template-columns: 77px 1fr;
      grid-template-areas:
        "avatar info"
        "bio bio"
        "stats stats";
      column-gap: 28px;
      padding: 16px 16px 0;
      margin-bottom: 0;
    }
    .profile-avatar { grid-area: avatar; margin: 0; }
    .avatar { width: 77px; height: 77px; }
    .profile-info { display: contents; }
    .row-username { grid-area: info; margin: 0; align-content: center; }
    .username { width: 100%; margin: 0 0 4px; }
    .row-username .btn-icon { display: none; }
    .bio { grid-area: bio; padding: 16px 0 20px; }
    .stats {
      grid-area: stats;
      margin: 0 -16px;
      border-top: 1px solid var(--border);
      padding: 12px 0;
      font-size: 14px;
      line-height: 18px;
    }
    .stats li {
      flex: 1;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stats .label { color: var(--text-secondary); }
    .tabs { gap: 0; justify-content: space-around; }
    .tab span { display: none; }
    .tab svg { width: 24px; height: 24px; }
    .tab.active { color: var(--blue); border-top-color: transparent; }
    .grid { gap: 2px; }
    .post-overlay { display: none; }
  }
</style>
</head>
<body>
<main>
  <header class="profile">
    <div class="profile-avatar">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 150 150">
          <circle cx="75" cy="58" r="28" fill="var(--avatar-fg)"/>
          <path d="M18 150c3-35 27-58 57-58s54 23 57 58Z" fill="var(--avatar-fg)"/>
        </svg>
      </div>
    </div>

    <section class="profile-info">
      <div class="row-username">
        <h1 class="username">mon_profil</h1>
        <button class="btn" type="button">Modifier le profil</button>
        <button class="btn btn-primary" type="button" id="add-btn">＋ Ajouter</button>
        <button class="btn btn-icon" type="button" aria-label="Options">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.635"/>
            <path d="M14.232 3.656a1.269 1.269 0 0 1-.796-.66L12.93 2h-1.86l-.505.996a1.269 1.269 0 0 1-.796.66m-.001 16.688a1.269 1.269 0 0 1 .796.66l.505.996h1.862l.505-.996a1.269 1.269 0 0 1 .796-.66M3.656 9.768a1.269 1.269 0 0 1-.66.796L2 11.07v1.862l.996.505a1.269 1.269 0 0 1 .66.796m16.688-.001a1.269 1.269 0 0 1 .66-.796L22 12.93v-1.86l-.996-.505a1.269 1.269 0 0 1-.66-.796M7.678 4.522a1.269 1.269 0 0 1-1.03.096l-1.06-.348L4.27 5.587l.348 1.062a1.269 1.269 0 0 1-.096 1.03m11.8 11.799a1.269 1.269 0 0 1 1.03-.096l1.06.348 1.318-1.317-.348-1.062a1.269 1.269 0 0 1 .096-1.03m-14.956.001a1.269 1.269 0 0 1 .096 1.03l-.348 1.06 1.317 1.318 1.062-.348a1.269 1.269 0 0 1 1.03.096m11.799-11.8a1.269 1.269 0 0 1-.096-1.03l.348-1.06-1.317-1.318-1.062.348a1.269 1.269 0 0 1-1.03-.096"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <input type="file" id="file-input" accept="image/*" multiple>
      </div>

      <ul class="stats">
        <li><b id="post-count">0</b> <span class="label" id="post-label">publication</span></li>
        <li><b>248</b> <span class="label">followers</span></li>
        <li><b>312</b> <span class="label">suivi(e)s</span></li>
      </ul>

      <div class="bio">
        <div class="bio-name">Mon Profil</div>
        <div class="bio-category">Créateur de contenu</div>
        <div class="bio-text">📍 Paris, France
📸 Photographie &amp; voyages
✨ Nouvelles photos chaque semaine</div>
        <a class="bio-link" href="#" onclick="return false">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1 1"/><path d="M14 10a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1-1"/></svg>
          monprofil.fr
        </a>
      </div>
    </section>
  </header>

  <nav class="tabs" role="tablist">
    <a class="tab active" href="#" role="tab" aria-selected="true" onclick="return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><path d="M9.015 3v18M14.985 3v18M21 9.015H3M21 14.985H3"/></svg>
      <span>Publications</span>
    </a>
    <a class="tab" href="#" role="tab" aria-selected="false" onclick="return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2.049 7.002h19.902"/><path d="M13.504 2.001 16.362 7.002"/><path d="M7.207 2.11 10.002 7.002"/><path d="M2 12.001v3.449c0 2.849.698 4.006 1.606 4.945.94.908 2.098 1.607 4.946 1.607h6.896c2.848 0 4.006-.699 4.946-1.607.908-.939 1.606-2.096 1.606-4.945V8.552c0-2.848-.698-4.006-1.606-4.945C19.454 2.699 18.296 2 15.448 2H8.552c-2.848 0-4.006.699-4.946 1.607C2.698 4.546 2 5.704 2 8.552Z"/><path d="M9.763 17.664a.908.908 0 0 1-.454-.787V11.63a.909.909 0 0 1 1.364-.788l4.545 2.624a.909.909 0 0 1 0 1.575l-4.545 2.624a.91.91 0 0 1-.91 0Z" fill="currentColor"/></svg>
      <span>Reels</span>
    </a>
    <a class="tab" href="#" role="tab" aria-selected="false" onclick="return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.201 3.797 12 1.997l1.799 1.8a1.59 1.59 0 0 0 1.124.465h5.259A1.818 1.818 0 0 1 22 6.08v14.104a1.818 1.818 0 0 1-1.818 1.818H3.818A1.818 1.818 0 0 1 2 20.184V6.08a1.818 1.818 0 0 1 1.818-1.818h5.26a1.59 1.59 0 0 0 1.123-.465Z"/><path d="M18.598 22.002V21.4a3.949 3.949 0 0 0-3.948-3.949H9.495A3.949 3.949 0 0 0 5.546 21.4v.603"/><circle cx="12.072" cy="11.075" r="3.556"/></svg>
      <span>Identifié(e)</span>
    </a>
  </nav>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6.549 5.013A1.557 1.557 0 1 0 8.106 6.57a1.557 1.557 0 0 0-1.557-1.557Z" fill-rule="evenodd"/><path d="m2 18.605 3.901-3.9a.908.908 0 0 1 1.284 0l2.807 2.806a.908.908 0 0 0 1.283 0l5.534-5.534a.908.908 0 0 1 1.283 0l3.905 3.905"/><path d="M18.44 2.004A3.56 3.56 0 0 1 22 5.564h0v12.873a3.56 3.56 0 0 1-3.56 3.56H5.568a3.56 3.56 0 0 1-3.56-3.56V5.563a3.56 3.56 0 0 1 3.56-3.56Z"/></svg>
    </div>
    <h2>Partager des photos</h2>
    <p>Les photos que vous partagez apparaîtront sur votre profil.</p>
    <button type="button" id="empty-add">Partagez votre première photo</button>
  </div>
</main>

<script>
(function () {
  const grid = document.getElementById('grid');
  const input = document.getElementById('file-input');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('post-count');
  const labelEl = document.getElementById('post-label');

  const HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-5.197 7.222-2.512 2.243-3.865 3.469-4.303 3.752-.477-.309-2.143-1.823-4.303-3.752C5.141 14.072 2.5 12.167 2.5 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.278-.588 1.11-1.766a4.17 4.17 0 0 1 3.679-1.938Z"/></svg>';
  const BUBBLE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/></svg>';

  function updateCount() {
    const n = grid.children.length;
    countEl.textContent = n.toLocaleString('fr-FR');
    labelEl.textContent = n > 1 ? 'publications' : 'publication';
    empty.hidden = n > 0;
  }

  function createPost(file) {
    const post = document.createElement('div');
    post.className = 'post';
    post.draggable = true;

    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.alt = file.name;
    img.draggable = false;

    const overlay = document.createElement('div');
    overlay.className = 'post-overlay';
    overlay.innerHTML = '<span>' + HEART + '0</span><span>' + BUBBLE + '0</span>';

    post.append(img, overlay);
    return post;
  }

  function openPicker() { input.click(); }
  document.getElementById('add-btn').addEventListener('click', openPicker);
  document.getElementById('empty-add').addEventListener('click', openPicker);

  input.addEventListener('change', function () {
    for (const file of input.files) {
      if (!file.type.startsWith('image/')) continue;
      grid.prepend(createPost(file));
    }
    input.value = '';
    updateCount();
  });

  /* ---------- Drag & drop (API native HTML5) ---------- */
  let dragged = null;

  grid.addEventListener('dragstart', function (e) {
    const post = e.target.closest('.post');
    if (!post) return;
    dragged = post;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');
    grid.classList.add('is-dragging');
    requestAnimationFrame(function () { post.classList.add('dragging'); });
  });

  grid.addEventListener('dragover', function (e) {
    if (!dragged) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const target = e.target.closest('.post');
    if (!target || target === dragged) return;
    const items = Array.from(grid.children);
    const from = items.indexOf(dragged);
    const to = items.indexOf(target);
    grid.insertBefore(dragged, from < to ? target.nextSibling : target);
  });

  grid.addEventListener('drop', function (e) {
    if (dragged) e.preventDefault();
  });

  grid.addEventListener('dragend', function () {
    if (dragged) dragged.classList.remove('dragging');
    grid.classList.remove('is-dragging');
    dragged = null;
  });

  updateCount();
})();
</script>
</body>
</html>
