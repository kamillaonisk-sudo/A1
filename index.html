.fr { font-family: "Fredoka", "Nunito", sans-serif; font-weight: 600; }
.muted { color: var(--muted); }
svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.end { background: var(--coral); color: #fff; border-radius: 6px; padding: 0 3px; margin-left: 1px; }

/* ---------- home ---------- */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.logo { width: 46px; height: 46px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; font: 700 17px "Fredoka", sans-serif; flex: none; }
.top .t1 { font-weight: 900; font-size: 20px; line-height: 1.1; }
.top .t2 { font-size: 13px; color: var(--muted); }
.stats { margin-left: auto; display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 99px; background: var(--card); border: 1.5px solid var(--line); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; }
.daily { display: flex; align-items: center; gap: 18px; padding: 18px; border: 1.5px solid var(--ink); border-radius: 22px; background: var(--card); }
.ring { position: relative; width: 78px; height: 78px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 17px; font-variant-numeric: tabular-nums; }
.daily h3 { font-size: 17px; }
.daily p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.row-h { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; }
.row-h h2 { font-size: 26px; }
.bento { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 118px; gap: 12px; }
.tile { position: relative; overflow: hidden; border: 0; border-radius: 22px; padding: 0; text-align: left; background: var(--a); }
.tile.tall { grid-row: span 2; }
.tile.wide { grid-column: span 2; }
.tile .lbl { position: absolute; left: 14px; bottom: 12px; right: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.tile .lbl b { font-size: 21px; font-weight: 900; line-height: 1.05; }
.tile .lbl span { font-size: 12px; font-weight: 800; background: var(--card); border-radius: 99px; padding: 3px 9px; font-variant-numeric: tabular-nums; flex: none; }
.tile .fr-t { position: absolute; left: 14px; top: 12px; font: 600 15px "Fredoka", sans-serif; background: var(--card); border-radius: 12px 12px 12px 3px; padding: 2px 10px; }
.tile:active { transform: scale(.98); }

/* ---------- section ---------- */
.hero { position: relative; overflow: hidden; border-radius: 26px 26px 0 0; background: var(--a); height: 170px; }
.hero .bar-top { position: relative; display: flex; align-items: center; padding: 14px; z-index: 1; }
.hero .bar-top h1 { position: absolute; left: 0; right: 0; text-align: center; font-size: 18px; pointer-events: none; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card); display: grid; place-items: center; flex: none; }
.round svg { width: 20px; height: 20px; }
.sheet { position: relative; background: var(--card); border-radius: 26px; margin-top: -34px; padding: 22px 18px 20px; }
.sheet h2 { font-size: 28px; }
.sheet .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.meter { height: 8px; background: #f0ebe4; border-radius: 99px; overflow: hidden; margin-top: 12px; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: inherit; }
.h-sm { font-size: 20px; margin: 22px 0 4px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.chips button { border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 13px; font-weight: 800; font-size: 14px; }
.chips button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.list { display: grid; gap: 2px; margin-top: 6px; }
.item { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 9px 0; border-radius: 16px; }
.item:hover .thumb { transform: rotate(-3deg); }
.item:disabled { cursor: default; opacity: .45; }
.thumb { position: relative; width: 66px; height: 66px; flex: none; border-radius: 16px; overflow: hidden; background: var(--a); transition: transform .2s; }
.thumb .ic { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; }
.thumb .ic svg { width: 17px; height: 17px; }
.item .tt { font-weight: 900; font-size: 17px; line-height: 1.2; }
.item .dd { font-size: 13.5px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.lvl { display: inline-block; margin-top: 3px; font-size: 11px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
.lvl.l1 { color: var(--green); } .lvl.l2 { color: #c77d00; } .lvl.l3 { color: #e0452e; }
.lvl .best { color: var(--muted); font-weight: 700; letter-spacing: 0; text-transform: none; margin-left: 6px; }

/* ---------- rule card (schematic) ---------- */
.rule { margin-top: 16px; background: var(--cream); border: 1.5px solid var(--line); border-radius: 20px; padding: 14px 14px 12px; display: grid; gap: 10px; }
.rule-h { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; }
.rule-h .badge { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; background: var(--ink); color: #fff; border-radius: 99px; padding: 2px 9px; }
.scheme { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; }
.w { display: inline-flex; align-items: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 3px 10px; font: 600 17px "Fredoka", sans-serif; }
.w.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.arr { font-weight: 900; color: var(--muted); }
.egrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.egrid .w { justify-content: space-between; gap: 6px; font-size: 16px; }
.egrid .w small { font: 700 12px "Nunito", sans-serif; color: var(--muted); }
.note { font-size: 13.5px; color: var(--muted); }
.note b { color: var(--ink); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 5px; margin: -5px; }
.tbl th { font-size: 12px; font-weight: 800; color: var(--muted); text-align: left; padding: 0 4px; }
.tbl td { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; text-align: center; font: 600 18px "Fredoka", sans-serif; padding: 4px; }
.tbl td.hl { background: var(--pink); }
.tbl td.hl2 { background: var(--lime); }
.rule-sep { height: 1.5px; background: var(--line); }
.prep-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.prep-row div { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 4px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.prep-row b { display: block; font: 600 22px "Fredoka", sans-serif; color: var(--ink); }

/* ---------- verb dropdowns ---------- */
details.verb { border: 1.5px solid var(--line); border-radius: 18px; background: var(--card); }
details.verb + details.verb { margin-top: 8px; }
details.verb summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
details.verb summary::-webkit-details-marker { display: none; }
details.verb summary .fr { font-size: 19px; }
details.verb summary .ru { color: var(--muted); font-size: 14px; }
details.verb summary .chev { margin-left: auto; transition: transform .2s; width: 20px; height: 20px; flex: none; }
details.verb[open] summary .chev { transform: rotate(180deg); }
details.verb .body { padding: 0 14px 14px; }
.gtag { font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 99px; background: var(--lime); }
.gtag.g3 { background: var(--pink); }
.sublbl { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 2px; }

/* ---------- cheat sheet ---------- */
.cards { display: grid; gap: 12px; margin-top: 16px; }
.card { background: var(--card); border-radius: 20px; padding: 16px; border: 1.5px solid var(--line); }
.card h3 { font-size: 18px; margin-bottom: 8px; }
.ex { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.ex .fr { font-size: 17px; line-height: 1.2; }
.ex .ru { font-size: 13px; color: var(--muted); }
.say { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 0; background: var(--lime); display: grid; place-items: center; }
.say svg { width: 17px; height: 17px; }
.conj { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.conj .ex { margin: 5px 0; }
.conj .fr { font-size: 16px; }
.numsay { display: flex; align-items: center; gap: 12px; min-height: 48px; margin-bottom: 10px; }
.numsay .fr { font-size: 22px; }
.numgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.numgrid button { height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font: 600 16px "Fredoka", sans-serif; font-variant-numeric: tabular-nums; }
.numgrid button.on { background: var(--yellow); border-color: var(--ink); }
.vrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1.5px solid var(--line); }
.vrow:last-child { border-bottom: 0; }
.vrow .fr { font-size: 17px; }
.vrow .ru { margin-left: auto; text-align: right; font-size: 14px; color: var(--muted); }

/* ---------- exercise ---------- */
.ex-top { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.prog { flex: 1; height: 12px; border-radius: 99px; background: #f0e2cf; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--green); border-radius: inherit; transition: width .35s; }
.count { font-weight: 800; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kind { display: inline-block; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; padding: 5px 12px; border-radius: 99px; background: var(--a, var(--lime)); margin-bottom: 12px; }
.ask { font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.q { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 28px; line-height: 1.25; white-space: pre-line; }
.q.ru { font-family: "Nunito", sans-serif; font-weight: 800; font-size: 22px; }
.q-ru { color: var(--muted); font-size: 15px; margin-top: 6px; white-space: pre-line; }
.qwrap { margin-bottom: 22px; }
.listen { display: flex; gap: 10px; margin-bottom: 22px; }
.play { display: flex; align-items: center; gap: 10px; border: 0; border-radius: 20px; padding: 18px 24px; background: var(--violet); color: #fff; font-weight: 900; font-size: 17px; }
.play svg { width: 26px; height: 26px; }
.play.slow { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); padding: 18px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 18px; padding: 14px 16px; font: 600 19px "Fredoka", sans-serif; }
.opt .k { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 1.5px solid var(--line); display: grid; place-items: center; font: 800 12px "Nunito", sans-serif; color: var(--muted); }
.opt.sel { border-color: var(--violet); background: #efe9ff; box-shadow: 0 0 0 1.5px var(--violet); }
.opt.ok { border-color: var(--green); background: #e1f9e9; }
.opt.bad { border-color: var(--coral); background: #ffe6e1; }
.opt:disabled { cursor: default; color: var(--ink); }
.field { width: 100%; font: 600 22px/1.3 "Fredoka", sans-serif; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 15px 16px; }
.field:focus { border-color: var(--violet); outline: none; box-shadow: 0 0 0 1.5px var(--violet); }
textarea.field { min-height: 110px; resize: vertical; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.tools button { min-width: 40px; height: 38px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font: 600 17px "Fredoka", sans-serif; }
.tools .hint { margin-left: auto; padding: 0 12px; font: 800 14px "Nunito", sans-serif; }
.tray { min-height: 62px; border-bottom: 2px dashed var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 12px; margin-bottom: 18px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tok { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 9px 15px; font: 600 19px "Fredoka", sans-serif; box-shadow: 0 2px 0 var(--line); }
.tok.used { visibility: hidden; }
.words { display: flex; flex-wrap: wrap; gap: 8px; }
.words .opt { padding: 10px 14px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.match .opt { font-size: 16px; padding: 12px; justify-content: center; text-align: center; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.refs { margin-top: 14px; }

/* ---------- dock ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, rgba(255,243,227,0)); }
.dock.fb { background: var(--card); border-radius: 26px 26px 0 0; box-shadow: 0 -6px 30px rgba(23,23,28,.12); padding-top: 18px; }
.dock.fb.ok { background: var(--lime); }
.dock.fb.bad { background: #ffb4a6; }
.dock-in { max-width: 520px; margin: 0 auto; display: grid; gap: 10px; }
.fb-h { font-weight: 900; font-size: 22px; }
.fb-ans { display: flex; align-items: center; gap: 10px; }
.fb-ans .fr { font-size: 21px; line-height: 1.2; }
.fb-ans .ru { font-size: 14px; }
.fb-why { font-size: 14px; }
.fb .say { background: var(--card); }
.btn { width: 100%; border: 0; border-radius: 18px; padding: 16px; font: 900 17px "Nunito", sans-serif; background: var(--ink); color: #fff; }
.btn:disabled { background: #e6dccd; color: #8f877c; cursor: default; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.btn .kbd { opacity: .55; font-weight: 700; font-size: 13px; margin-left: 8px; }
@media (pointer: coarse) { .btn .kbd, .opt .k { display: none; } }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint-line { text-align: center; font-weight: 700; color: var(--muted); }

/* ---------- result ---------- */
.result { position: relative; overflow: hidden; border-radius: 28px; background: var(--a, var(--lime)); height: 240px; margin-top: 10px; }
.result .big { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; background: var(--card); border-radius: 26px; padding: 14px 26px; }
.result .big b { display: block; font: 700 56px "Fredoka", sans-serif; line-height: 1; font-variant-numeric: tabular-nums; }
.result .big span { font-weight: 800; font-size: 14px; }
.res-h { text-align: center; margin: 22px 0 6px; font-size: 30px; }
.res-p { text-align: center; color: var(--muted); margin: 0; }
.linkbtn { display: block; margin: 22px auto 0; background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 8px; }

@media (max-width: 370px) { .q { font-size: 24px; } .bento { grid-auto-rows: 104px; } .egrid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    const deco = [
      `<path d="${wave(-10, h * .62, w + 20, Math.min(h, 120) * .06, 5)}" fill="none" stroke="#17171c" stroke-width="3" stroke-linecap="round"/>`,
      `<path d="${burst(w * .84, h * .24, M * .05, M * .12, 12)}" stroke="#17171c" stroke-width="2.5" stroke-linecap="round"/>`,
      `<g fill="none" stroke="#17171c" stroke-width="3.5" stroke-linecap="round">${[0, 1, 2].map(i => `<path d="M${(w * .98 - i * 16).toFixed(1)},${(h * .02).toFixed(1)} q${(-w * .06 - i * 6).toFixed(1)},${(h * .45).toFixed(1)} ${(-w * .2 - i * 14).toFixed(1)},${(h * .96).toFixed(1)}"/>`).join("")}</g>`
    ][v % 3];
    return `<svg class="art" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${blob}${deco}</svg>`;
  }

  // ---------- storage ----------
  const KEY = "cahierA1.v1";
  const blank = () => ({ xp: 0, streak: 0, lastDay: null, lessons: {}, srs: {}, items: {}, prefs: {}, best: {}, today: { d: null, n: 0 } });
  let S = blank();
  try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const GOAL = 20;

  const dayStr = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return dayStr(d); };
  function touchDay() {
    const today = dayStr();
    if (S.today.d !== today) S.today = { d: today, n: 0 };
    S.today.n++;
    if (S.lastDay === today) return;
    S.streak = S.lastDay === addDays(-1) ? S.streak + 1 : 1;
    S.lastDay = today;
  }
  const liveStreak = () => (S.lastDay === dayStr() || S.lastDay === addDays(-1)) ? S.streak : 0;
  const todayN = () => S.today.d === dayStr() ? S.today.n : 0;

  const GAPS = [1, 2, 4, 7];
  function srsWrong(k) { S.srs[k] = { box: 0, due: dayStr() }; }
  function srsRight(k) { const it = S.srs[k]; if (!it) return; it.box++; if (it.box > GAPS.length) delete S.srs[k]; else it.due = addDays(GAPS[it.box - 1]); }

  // ---------- helpers ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const uniq = a => [...new Set(a)];
  const norm = s => String(s).toLowerCase().replace(/[’`]/g, "'").replace(/[.,!?«»;:—]/g, " ").replace(/\s*-\s*/g, "-").replace(/\s*'\s*/g, "'").replace(/\s+/g, " ").trim();
  const bare = s => norm(s).normalize("NFD").replace(/[̀-ͯ]/g, "");
  const tokenize = s => s.split(" ").reduce((a, t) => { if (/^[?!.]+$/.test(t) && a.length) a[a.length - 1] += " " + t; else a.push(t); return a; }, []);
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const blankify = (fr, w) => fr.replace(new RegExp("(^|[\\s'])" + reEsc(w) + "(?=[\\s.,?!-]|$)"), "$1___");

  // ---------- speech ----------
  let frVoice = null;
  const hasTTS = "speechSynthesis" in window;
  function pickVoice() { const vs = speechSynthesis.getVoices(); frVoice = vs.find(v => /^fr[-_]FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null; }
  if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, slow) {
    if (!hasTTS || text == null || text === "") return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "fr-FR"; if (frVoice) u.voice = frVoice;
    u.rate = slow ? 0.6 : 0.9;
    speechSynthesis.speak(u);
  }
  const sayBtn = t => `<button class="say" data-say="${esc(t)}" aria-label="Послушать">${ICON.speak}</button>`;
  document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); e.preventDefault(); speak(b.dataset.say, b.dataset.slow === "1"); } }, true);

  // ---------- клавиатура ----------
  // Enter — проверить, ещё Enter — дальше; стрелки и 1–4 — выбрать вариант
  let enterLock = 0;
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.key === "Enter") {
      const nx = $("#nx"), chk = $("#chk");
      if (!nx && !chk) return;
      e.preventDefault();
      if (e.repeat || Date.now() < enterLock) return;
      if (nx) nx.click();
      else if (!chk.disabled) chk.click();
      return;
    }
    if (e.target.tagName === "INPUT") return;
    const list = [...document.querySelectorAll(".opts .opt:not(:disabled), .words .opt:not(:disabled)")];
    if (!list.length) return;
    if (/^[1-9]$/.test(e.key)) { const o = list[+e.key - 1]; if (o) { o.click(); o.focus(); } return; }
    const dir = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (!dir) return;
    e.preventDefault();
    let i = list.findIndex(b => b.classList.contains("sel"));
    i = i < 0 ? (dir > 0 ? 0 : list.length - 1) : (i + dir + list.length) % list.length;
    list[i].click(); list[i].focus();
  });

  // ================================================================
  //  ДАННЫЕ
  // ================================================================
  const PRON = ["je", "tu", "il", "elle", "nous", "vous", "ils", "elles"];
  const GROUP = { 1: "I группа", 2: "II группа", 3: "III группа" };
  const VERB = Object.fromEntries(C.verbs.map(v => [v.inf, v]));
  const formOf = (v, p) => v.forms[p] || v.forms[{ elle: "il", elles: "ils" }[p]];
  const ruOf = (v, p) => (v.ruForms || {})[p] || "";
  const elides = (p, f) => p === "je" && /^[aeiouéèêâh]/i.test(f);
  const pdisp = (p, f) => elides(p, f) ? "j'" : p;
  const pf = (p, f) => elides(p, f) ? "j'" + f : p + " " + f;
  const prons = v => PRON.filter(p => formOf(v, p));
  const whoHas = (v, f) => prons(v).filter(p => formOf(v, p) === f).map(p => pdisp(p, f)).join(", ");
  const headOf = (v, ex) => cap(pf(ex.p, formOf(v, ex.p)));
  const stemOf = v => (v.group === 1 || v.group === 2) ? v.inf.slice(0, -2) : null;
  // форма с выделенным окончанием (для I и II группы)
  function markForm(v, f) {
    const st = stemOf(v);
    return st && f.startsWith(st) && f.length > st.length ? esc(st) + `<span class="end">${esc(f.slice(st.length))}</span>` : esc(f);
  }
  const markPf = (v, p) => { const f = formOf(v, p); return (elides(p, f) ? "j'" : p + " ") + markForm(v, f); };

  const UNITS = ["", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
  const TENS = { 2: "vingt", 3: "trente", 4: "quarante", 5: "cinquante", 6: "soixante" };
  function nword(n) { if (n < 20) return UNITS[n]; const t = TENS[Math.floor(n / 10)], u = n % 10; return u === 0 ? t : u === 1 ? t + " et un" : t + "-" + UNITS[u]; }
  const nAnswers = n => { const w = nword(n); return w.includes(" et ") ? [w, w.replace(/ /g, "-")] : [w]; };
  function nExplain(n) {
    if (n <= 16) return `${n} — отдельное слово.`;
    if (n < 20) return `${n} = dix + ${UNITS[n - 10]}.`;
    if (n % 10 === 0) return `Это десяток.`;
    if (n % 10 === 1) return `На конце 1 → «et un».`;
    return `Десяток + единицы через дефис: ${TENS[Math.floor(n / 10)]}-${UNITS[n % 10]}.`;
  }
  const ruYears = n => n % 10 === 1 && n % 100 !== 11 ? "год" : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "года" : "лет";
  const NMAX = C.numbers.max;

  const NOUN = Object.fromEntries(C.nouns.map(n => [n.w, n]));
  const vowel = w => /^[aeiouéèêâh]/i.test(w);
  const indefOf = n => n.g === "f" ? "une" : "un";
  const defOf = n => vowel(n.w) ? "l'" : n.g === "f" ? "la" : "le";
  const withDef = (d, w) => d === "l'" ? "l'" + w : d + " " + w;
  const G_RU = { m: "м.р.", f: "ж.р." };
  const pairOf = n => n.pair && NOUN[n.pair];
  const pairNote = n => { const p = pairOf(n); return p ? ` Пара: <b>${indefOf(p)} ${esc(p.w)}</b> — ${esc(p.ru)} (${G_RU[p.g]}).` : n.both ? " Одинаково для м.р. и ж.р.: un / une " + esc(n.w) + "." : ""; };
  const artNouns = () => C.nouns.filter(n => !n.both);

  const PREP = { f: "en", m: "au", pl: "aux", city: "à" };
  const KIND_RU = { f: "страна ж.р.", m: "страна м.р.", pl: "страна мн.ч.", city: "город" };
  const RU_NOM = { je: "Я", tu: "Ты", il: "Он", elle: "Она", nous: "Мы", vous: "Вы", ils: "Они", elles: "Они" };
  const RU_GEN = { je: "меня", tu: "тебя", il: "него", elle: "неё", nous: "нас", vous: "вас", ils: "них", elles: "них" };
  const RU_DAT = { je: "Мне", tu: "Тебе", il: "Ему", elle: "Ей", nous: "Нам", vous: "Вам", ils: "Им", elles: "Им" };
  const RU_GO = { je: "Я еду", tu: "Ты едешь", il: "Он едет", elle: "Она едет", nous: "Мы едем", vous: "Вы едете", ils: "Они едут", elles: "Они едут" };
  const POSS_FR = { je: "mon", tu: "ton", il: "son", elle: "son", nous: "notre", vous: "votre", ils: "leur", elles: "leur" };
  const POSS_RU = { je: { m: "мой", f: "моя", n: "моё" }, tu: { m: "твой", f: "твоя", n: "твоё" }, il: "его / её", elle: "его / её",
    nous: { m: "наш", f: "наша", n: "наше" }, vous: { m: "ваш", f: "ваша", n: "ваше" }, ils: "их", elles: "их" };
  const ruPoss = (p, rg) => typeof POSS_RU[p] === "string" ? POSS_RU[p] : POSS_RU[p][rg];
  const PLACE = Object.fromEntries(C.places.map(p => [p.name, p]));

  // словарик: слова + существительные (с артиклем un/une — сразу виден род)
  const nounLabel = n => `${indefOf(n)} ${n.w}`;
  const VOCAB = C.vocab.concat(C.nouns.map(n => ({ fr: nounLabel(n), ru: n.ru, theme: n.theme, noun: n })));
  const WORD = Object.fromEntries(VOCAB.map(w => [w.fr, w]));

  // ================================================================
  //  ФРАЗЫ ИЗ ВСЕХ СЛОВ (шаблоны)
  // ================================================================
  const HAVE_TH = ["Семья", "Дом и вещи"];
  const P4 = ["je", "tu", "il", "elle"];
  const profsM = () => C.nouns.filter(n => n.theme === "Профессии" && n.g === "m");
  function profFor(p, n) { const pr = pairOf(n); if (p === "elle" && pr) return pr; if ((p === "je" || p === "tu") && pr && Math.random() < .5) return pr; return n; }
  const TPL = {
    cest: { verb: "être", make: () => ["cest", pick(C.nouns).w],
      build: ([, w]) => { const n = NOUN[w]; if (!n) return null; const a = indefOf(n);
        return { fr: `C'est ${a} ${n.w}.`, ru: `Это ${n.ru}.`, slots: [{ w: a, k: "art" }, { w: n.w, k: "noun" }] }; } },
    cesont: { verb: "être", make: () => ["cesont", pick(C.nouns.filter(n => !n.noPl)).w],
      build: ([, w]) => { const n = NOUN[w]; if (!n || n.noPl) return null;
        return { fr: `Ce sont des ${n.pl}.`, ru: `Это ${n.rupl}.`, slots: [{ w: "des", k: "art" }, { w: n.pl, k: "noun" }] }; } },
    avoir: { verb: "avoir", make: () => ["avoir", pick(PRON), pick(C.nouns.filter(n => HAVE_TH.includes(n.theme))).w],
      build: ([, p, w]) => { const n = NOUN[w], v = VERB.avoir; if (!n || !v) return null; const f = formOf(v, p), a = indefOf(n);
        return { fr: `${cap(pf(p, f))} ${a} ${n.w}.`, ru: `У ${RU_GEN[p]} есть ${n.ru}.`, slots: [{ w: f, k: "verb" }, { w: a, k: "art" }, { w: n.w, k: "noun" }] }; } },
    age: { verb: "avoir", make: () => ["age", pick(PRON), String(rnd(2, NMAX))],
      build: ([, p, num]) => { const v = VERB.avoir, n = +num; if (!v || !(n >= 2 && n <= NMAX)) return null; const f = formOf(v, p);
        return { fr: `${cap(pf(p, f))} ${nword(n)} ans.`, ru: `${RU_DAT[p]} ${n} ${ruYears(n)}.`, slots: [{ w: f, k: "verb" }] }; } },
    aller: { verb: "aller", make: () => ["aller", pick(PRON), pick(C.places).name],
      build: ([, p, name]) => { const pl = PLACE[name], v = VERB.aller; if (!pl || !v) return null; const f = formOf(v, p), pr = PREP[pl.kind];
        return { fr: `${cap(pf(p, f))} ${pr} ${name}.`, ru: `${RU_GO[p]} ${pl.ru}.`, slots: [{ w: f, k: "verb" }, { w: pr, k: "prep" }] }; } },
    poss: { verb: "être", make: () => ["poss", pick(PRON), pick(C.nouns.filter(n => n.g === "m" && n.rg && ["Семья", "Дом и вещи", "Досуг"].includes(n.theme))).w],
      build: ([, p, w]) => { const n = NOUN[w]; if (!n || !n.rg) return null; const ps = POSS_FR[p];
        return { fr: `C'est ${ps} ${n.w}.`, ru: `Это ${ruPoss(p, n.rg)} ${n.ru}.`, slots: [{ w: ps, k: "poss" }, { w: n.w, k: "noun" }] }; } },
    etre: { verb: "être", make: () => { const p = pick(P4); return ["etre", p, profFor(p, pick(profsM())).w]; },
      build: ([, p, w]) => { const n = NOUN[w], v = VERB["être"]; if (!n || !v) return null; const f = formOf(v, p);
        return { fr: `${cap(pf(p, f))} ${n.w}.`, ru: `${RU_NOM[p]} ${n.ru}.`, slots: [{ w: f, k: "verb" }, { w: n.w, k: "noun" }] }; } },
    travail: { verb: "travailler", make: () => { const p = pick(P4); return ["travail", p, profFor(p, pick(profsM().filter(n => n.ins))).w]; },
      build: ([, p, w]) => { const n = NOUN[w], v = VERB.travailler; if (!n || !n.ins || !v) return null; const f = formOf(v, p);
        return { fr: `${cap(pf(p, f))} comme ${n.w}.`, ru: `${cap(ruOf(v, p))} ${n.ins}.`, slots: [{ w: f, k: "verb" }, { w: n.w, k: "noun" }] }; } }
  };
  const tplFor = infs => Object.keys(TPL).filter(t => VERB[TPL[t].verb] && (!infs || infs.includes(TPL[t].verb)));
  function phraseKeys(tpls, n = 40) {
    const out = [];
    for (let i = 0; i < n * 2 && out.length < n; i++) { const t = pick(tpls); if (!t) break; const sp = TPL[t].make(); if (TPL[t].build(sp)) out.push("t|" + sp.join("~")); }
    return uniq(out);
  }
  function sampleSentences(inf, n) {
    const t = tplFor([inf]); const out = [];
    for (let i = 0; i < 20 && out.length < n && t.length; i++) { const T = TPL[pick(t)], s = T.build(T.make()); if (s && !out.some(o => o.fr === s.fr)) out.push(s); }
    return out;
  }

  // ================================================================
  //  ГЕНЕРАТОРЫ ЗАДАНИЙ
  // ================================================================
  const pickMode = (avail, modes) => { const m = modes ? avail.filter(x => modes.includes(x)) : avail; return m.length ? pick(m) : null; };

  const GEN = {
    // форма глагола: vf|inf|pronoun
    vf(inf, p, modes) {
      const v = VERB[inf]; if (!v) return null;
      const f = formOf(v, p); if (!f) return null;
      const st = stemOf(v);
      const avail = ["conj", "conjc", "pron", "dict"];
      if (st && f.startsWith(st)) avail.push("end");
      const m = pickMode(avail, modes); if (!m) return null;
      const full = pf(p, f), ru = ruOf(v, p);
      const base = { say: full, sayRu: ru, sayHtml: markPf(v, p), explain: `${inf} — ${esc(v.ru)}, ${GROUP[v.group]}.` };
      const blankP = elides(p, f) ? "j'___" : p + " ___";
      if (m === "end") {
        const ends = uniq(prons(v).map(q => formOf(v, q).slice(st.length)));
        const mine = f.slice(st.length);
        return { ...base, type: "choice", kind: "Окончание", ask: `${inf}: основа ${st} + окончание`, prompt: `${pdisp(p, f)}${elides(p, f) ? "" : " "}${st}___`, ru,
          options: [mine, ...shuffle(ends.filter(x => x !== mine)).slice(0, 2)].map(x => "-" + x), answer: "-" + mine,
          explain: `I группа: ${esc(p)} → <b>-${esc(mine)}</b>.` };
      }
      if (m === "conj") return { ...base, type: "input", kind: "Спряжение", ask: `Глагол ${inf}`, prompt: blankP, ru, answers: [f] };
      if (m === "conjc") {
        const others = shuffle(uniq(prons(v).map(q => formOf(v, q))).filter(x => x !== f)).slice(0, 2);
        return { ...base, type: "choice", kind: "Выбери форму", ask: `Глагол ${inf}`, prompt: blankP, ru, options: [f, ...others], answer: f };
      }
      if (m === "pron") {
        const me = pdisp(p, f);
        const others = shuffle(uniq(prons(v).filter(q => formOf(v, q) !== f).map(q => pdisp(q, formOf(v, q))))).slice(0, 2);
        return { ...base, type: "choice", kind: "Кто это?", ask: `Глагол ${inf}`, prompt: "___ " + f, options: [me, ...others], answer: me,
          explain: `${esc(f)} — форма для: <b>${esc(whoHas(v, f))}</b>.` };
      }
      return { ...base, type: "input", kind: "Правописание", ask: `Послушай и запиши · ${inf}`, audio: full, prompt: "", answers: [full] };
    },
    vt(inf, _, modes) {
      const v = VERB[inf]; if (!v || !v.ru) return null;
      const m = pickMode(["fr2ru", "ru2fr"], modes); if (!m) return null;
      const base = { say: inf, sayRu: v.ru, explain: "" };
      const others = k => shuffle(C.verbs.filter(x => x !== v && x.ru).map(x => x[k])).slice(0, 2);
      if (m === "fr2ru") return { ...base, type: "choice", kind: "Переведи", prompt: inf, options: [v.ru, ...others("ru")], answer: v.ru };
      return { ...base, type: "choice", kind: "Переведи", prompt: v.ru, options: [inf, ...others("inf")], answer: inf };
    },
    vm(inf, _, modes) {
      const v = VERB[inf]; if (!v || pickMode(["match"], modes) === null) return null;
      const seen = new Set(), pairs = [];
      ["je", "tu", "il", "nous", "vous", "ils"].forEach(p => { const f = formOf(v, p); if (f && !seen.has(f)) { seen.add(f); pairs.push([pdisp(p, f), f]); } });
      return { type: "match", kind: "Соедини пары", prompt: `${inf} — ${v.ru}`, pairs, explain: "" };
    },
    // фраза из конспекта: vs|inf|index
    vs(inf, i, modes) {
      const v = VERB[inf]; const ex = v && v.examples[+i]; if (!ex) return null;
      const form = ex.v || (ex.p && formOf(v, ex.p));
      const avail = ["order", "dict"];
      if (form) avail.push("fill");
      if (ex.ru) avail.push("translate");
      if (ex.p && !ex.fixed && ex.fr.startsWith(headOf(v, ex))) avail.push("transform", "find", "fix");
      const m = pickMode(avail, modes); if (!m) return null;
      const fr = ex.fr, base = { say: fr, sayRu: ex.ru, explain: "" };
      if (m === "order") return { ...base, type: "order", kind: "Собери фразу", prompt: ex.ru || "Собери фразу", tokens: tokenize(fr) };
      if (m === "dict") return { ...base, type: "input", kind: "Диктант", ask: "Послушай и запиши", audio: fr, prompt: "", answers: [fr] };
      if (m === "translate") return { ...base, type: "input", kind: "Переведи фразу", ask: "Напиши по-французски", prompt: ex.ru, answers: [fr] };
      if (m === "fill") return { ...base, type: "input", kind: "Вставь глагол", ask: `Глагол ${inf}`, prompt: blankify(fr, form), ru: ex.ru, answers: [form] };
      const old = headOf(v, ex), rest = fr.slice(old.length);
      const q = pick(prons(v).filter(x => x !== ex.p && x !== "je" && formOf(v, x) !== formOf(v, ex.p))); if (!q) return null;
      const right = cap(pf(q, formOf(v, q))) + rest;
      const qBase = { say: right, sayRu: ruOf(v, q) ? `${pf(q, formOf(v, q))} — ${ruOf(v, q)}` : "" };
      if (m === "transform") return { ...qBase, type: "input", kind: "Переделай", ask: `Начни с «${cap(q)}»`, prompt: fr, ru: ex.ru, answers: [right], explain: `${q} → <b>${esc(formOf(v, q))}</b>.` };
      const wf = pick(uniq(prons(v).map(r => formOf(v, r))).filter(f => f !== formOf(v, q)));
      const bad = cap(q) + " " + wf + rest;
      const why = `${q} → <b>${esc(formOf(v, q))}</b>, а ${esc(wf)} — для: ${esc(whoHas(v, wf))}.`;
      if (m === "find") return { ...qBase, type: "find", kind: "Найди ошибку", prompt: "Нажми на неправильное слово", words: tokenize(bad), wrong: 1, explain: why };
      return { ...qBase, type: "input", kind: "Исправь ошибку", ask: "Напиши правильно", prompt: bad, answers: [right], explain: why };
    },
    // фраза из шаблона: t|tpl~a~b
    t(spec, _, modes) {
      const parts = spec.split("~"), T = TPL[parts[0]]; if (!T) return null;
      const s = T.build(parts); if (!s) return null;
      const hasArt = s.slots.some(z => z.k === "art");
      const m = pickMode(["fr2ru", "ru2fr1", "order", "dict"].concat(hasArt ? ["art1"] : []), modes); if (!m) return null;
      const base = { say: s.fr, sayRu: s.ru, explain: "" };
      if (m === "fr2ru") {
        const ds = [];
        for (let i = 0; i < 30 && ds.length < 2; i++) { const o = T.build(T.make()); if (o && o.ru !== s.ru && !ds.includes(o.ru)) ds.push(o.ru); }
        return { ...base, type: "choice", kind: "Переведи на русский", prompt: s.fr, options: [s.ru, ...ds], answer: s.ru, noRu: true };
      }
      if (m === "ru2fr1" || m === "art1") {
        const slot = m === "art1" ? s.slots.find(z => z.k === "art") : pick(s.slots);
        if (m === "art1") return { ...base, type: "choice", kind: "Какой артикль?", prompt: blankify(s.fr, slot.w), ru: s.ru, options: ["un", "une", "des"], answer: slot.w };
        return { ...base, type: "input", kind: "Вставь одно слово", ask: "Переведи: впиши пропущенное слово", prompt: blankify(s.fr, slot.w), ru: s.ru, answers: [slot.w] };
      }
      if (m === "order") return { ...base, type: "order", kind: "Собери фразу", prompt: s.ru, tokens: tokenize(s.fr) };
      return { ...base, type: "input", kind: "Диктант", ask: "Послушай и запиши", audio: s.fr, prompt: "", answers: [s.fr] };
    },
    // число: n|N
    n(nStr, _, modes) {
      const n = +nStr; if (!(n >= 1 && n <= NMAX)) return null;
      const m = pickMode(["d2w", "w2d", "hear", "hearc", "calc", "age", "ageh"], modes); if (!m) return null;
      const w = nword(n), base = { say: String(n), sayRu: `${n} — ${w}`, explain: nExplain(n) };
      if (m === "d2w") return { ...base, type: "input", kind: "Напиши буквами", prompt: String(n), answers: nAnswers(n) };
      if (m === "w2d") return { ...base, type: "input", digits: true, kind: "Напиши цифрами", prompt: w, answers: [String(n)] };
      if (m === "hear") return { ...base, type: "input", digits: true, kind: "На слух", ask: "Какое число? Напиши цифрами", audio: String(n), prompt: "", answers: [String(n)] };
      if (m === "hearc") {
        const u = n % 10;
        const c = uniq([n + 1, n - 1, n + 10, n - 10, u, u + 10, u * 10].filter(x => x >= 1 && x <= NMAX && x !== n));
        return { ...base, type: "choice", kind: "Что ты услышала?", audio: String(n), prompt: "", options: [String(n), ...shuffle(c).slice(0, 2).map(String)], answer: String(n) };
      }
      if (m === "calc") {
        let a, b, op;
        if (n >= 2 && (n === NMAX || Math.random() < .5)) { op = "+"; a = rnd(1, n - 1); b = n - a; } else { op = "−"; b = rnd(1, NMAX - n); a = n + b; }
        const prompt = Math.random() < .5 ? `${a} ${op} ${b} = ?` : `${nword(a)} ${op} ${nword(b)} = ?`;
        return { ...base, type: "input", kind: "Реши пример", ask: "Ответ напиши буквами", prompt, answers: nAnswers(n), sayRu: `${a} ${op} ${b} = ${n}`,
          explain: `${nword(a)} ${op} ${nword(b)} = <b>${w}</b>` };
      }
      const sent = n === 1 ? "Il a 1 an." : `J'ai ${n} ans.`;
      const sentW = n === 1 ? "Il a un an." : `J'ai ${w} ans.`;
      const ruS = n === 1 ? "Ему 1 год." : `Мне ${n} ${ruYears(n)}.`;
      const ab = { say: sentW, sayRu: ruS, explain: nExplain(n) + (n === 1 ? " 1 → an, больше → ans." : "") };
      if (m === "age") return { ...ab, type: "input", kind: "Возраст", ask: "Напиши число буквами", prompt: sent, ru: ruS, answers: [...nAnswers(n), sentW] };
      return { ...ab, type: "input", digits: true, kind: "Возраст на слух", ask: "Сколько лет? Напиши цифрами", audio: sentW, prompt: "", answers: [String(n)] };
    },
    // существительное: a|mot
    a(w, _, modes) {
      const n = NOUN[w]; if (!n || n.both) return null;
      const avail = ["indef", "def", "gender"].concat(n.noPl ? [] : ["plural"]);
      const m = pickMode(avail, modes); if (!m) return null;
      const pl = !n.noPl && Math.random() < .3, word = pl ? n.pl : n.w, ru = pl ? n.rupl : n.ru;
      const pn = pairNote(n);
      if (m === "indef") {
        const ans = pl ? "des" : indefOf(n);
        return { type: "choice", kind: "un · une · des", prompt: `___ ${word}`, ru, options: ["un", "une", "des"], answer: ans, say: `${ans} ${word}`, sayRu: ru,
          explain: (pl ? `Мн.ч. → <b>des</b>.` : `${esc(n.w)} — ${G_RU[n.g]} → <b>${ans}</b>.`) + pn };
      }
      if (m === "def") {
        const ans = pl ? "les" : defOf(n), shown = withDef(ans, word);
        return { type: "choice", kind: "le · la · l' · les", prompt: `___ ${word}`, ru, options: ["le", "la", "l'", "les"], answer: ans, say: shown, sayRu: ru,
          explain: (pl ? `Мн.ч. → <b>les</b>.` : ans === "l'" ? `${esc(n.w)} начинается с гласной → <b>l'</b> (${G_RU[n.g]}).` : `${esc(n.w)} — ${G_RU[n.g]} → <b>${ans}</b>.`) + pn };
      }
      if (m === "gender") return { type: "choice", kind: "Какой род?", prompt: n.w, ru: n.ru, options: ["м.р.", "ж.р."], answer: G_RU[n.g], say: `${indefOf(n)} ${n.w}`, sayRu: n.ru,
        explain: `<b>${indefOf(n)} ${esc(n.w)}</b> → ${G_RU[n.g]}.` + pn };
      return { type: "input", kind: "Мн. число", ask: "Поставь во множественное число", prompt: `${indefOf(n)} ${n.w} → des ___`, ru: `${n.ru} → ${n.rupl}`, answers: [n.pl], say: `des ${n.pl}`, sayRu: n.rupl,
        explain: n.pl === n.w ? `Не меняется: ${esc(n.w)} → ${esc(n.pl)}.` : n.pl.endsWith("x") ? `-eau → + <b>x</b>.` : `Мн.ч. → + <b>s</b> (не читается).` };
    },
    // страна/город: p|Nom
    p(name, _, modes) {
      const pl = PLACE[name]; if (!pl || pickMode(["prep"], modes) === null) return null;
      const v = VERB.aller, q = pick(prons(v)), head = cap(pf(q, formOf(v, q))), prep = PREP[pl.kind];
      return { type: "choice", kind: "Страны и города", prompt: `${head} ___ ${name}.`, ru: `${RU_GO[q]} ${pl.ru}.`, options: ["à", "en", "au", "aux"], answer: prep,
        say: `${head} ${prep} ${name}.`, sayRu: `${RU_GO[q]} ${pl.ru}.`, explain: `${esc(name)} — ${KIND_RU[pl.kind]} → <b>${prep}</b>.` };
    },
    as(i, _, modes) {
      const s = C.articles.sentences[+i]; if (!s) return null;
      const m = pickMode(["order", "dict"], modes); if (!m) return null;
      const base = { say: s.fr, sayRu: s.ru, explain: "" };
      if (m === "order") return { ...base, type: "order", kind: "Собери фразу", prompt: s.ru, tokens: tokenize(s.fr) };
      return { ...base, type: "input", kind: "Диктант", ask: "Послушай и запиши", audio: s.fr, prompt: "", answers: [s.fr] };
    },
    // слово: w|fr
    w(fr, _, modes) {
      const w = WORD[fr]; if (!w) return null;
      const m = pickMode(["fr2ru", "ru2fr", "write", "hear", "dict"], modes); if (!m) return null;
      const n = w.noun;
      const base = { say: w.fr, sayRu: w.ru, explain: n ? `${G_RU[n.g]}.` + pairNote(n) : "" };
      const pool = VOCAB.filter(x => x !== w && x.theme === w.theme).concat(VOCAB.filter(x => x !== w && x.theme !== w.theme));
      const others = k => { const o = []; for (const x of shuffle(pool.slice(0, 12)).concat(pool)) { if (o.length >= 2) break; if (x[k] !== w[k] && !o.includes(x[k])) o.push(x[k]); } return o; };
      const answers = n ? [w.fr, n.w] : [w.fr];
      if (m === "fr2ru") return { ...base, type: "choice", kind: "Переведи", prompt: w.fr, options: [w.ru, ...others("ru")], answer: w.ru };
      if (m === "ru2fr") return { ...base, type: "choice", kind: "Переведи", prompt: w.ru, options: [w.fr, ...others("fr")], answer: w.fr };
      if (m === "write") return { ...base, type: "input", kind: "Правописание", ask: n ? "Напиши по-французски (можно с un / une)" : "Напиши по-французски", prompt: w.ru, answers };
      if (m === "hear") return { ...base, type: "choice", kind: "Что ты услышала?", audio: w.fr, prompt: "", options: [w.fr, ...others("fr")], answer: w.fr };
      return { ...base, type: "input", kind: "Диктант", ask: "Послушай и запиши", audio: w.fr, prompt: "", answers };
    },
    wm(theme, _, modes) {
      if (pickMode(["match"], modes) === null) return null;
      const pool = VOCAB.filter(w => !theme || w.theme === theme);
      const pairs = []; const ru = new Set();
      for (const w of shuffle(pool)) { if (pairs.length >= 5) break; if (!ru.has(w.ru)) { ru.add(w.ru); pairs.push([w.fr, w.ru]); } }
      if (pairs.length < 3) return null;
      return { type: "match", kind: "Соедини пары", prompt: "Слово и перевод", pairs, noKey: true, explain: "" };
    },
    L(id) { const x = LESSON_EX[id]; return x ? { ...x.ex } : null; }
  };

  function ruleCard(id) {
    if (id === "verbs") {
      const v1 = C.verbs.find(v => v.group === 1);
      let h = `<div class="rule">`;
      if (!vGroup() || vGroup() === 1) {
        h += `<div class="rule-h"><span class="badge">I группа</span>глаголы на -er</div>`;
        if (v1) {
          const st = stemOf(v1);
          h += `<div class="scheme"><span class="w">${esc(st)}<span class="end">er</span></span><span class="arr">→</span><span class="w dark">${esc(st)}</span><span class="arr">+</span><span class="w"><span class="end">окончание</span></span></div>
            <div class="egrid">${["je", "nous", "tu", "vous", "il", "ils"].map(p => `<span class="w">${markPf(v1, p)}</span>`).join("")}</div>`;
        }
        h += `<div class="note">Убираем <b>-er</b>, добавляем окончание. <b>-e, -es, -ent</b> не читаются: je travaille и ils travaillent звучат одинаково. Исключение: <b>aller</b> — III группа.</div>`;
      }
      if (!vGroup() || vGroup() === 2) {
        if (!vGroup()) h += `<div class="rule-sep"></div>`;
        h += `<div class="rule-h"><span class="badge">II группа</span>глаголы на -ir</div>
          <div class="scheme"><span class="w">fin<span class="end">ir</span></span><span class="arr">→</span><span class="w">fin<span class="end">is</span> · fin<span class="end">issons</span></span></div>
          <div class="note">Окончания: -is, -is, -it, -issons, -issez, -issent. Пришли глаголы II группы — появятся тренировки.</div>`;
      }
      if (!vGroup() || vGroup() === 3) {
        if (!vGroup()) h += `<div class="rule-sep"></div>`;
        h += `<div class="rule-h"><span class="badge">III группа</span>неправильные</div>
          <div class="scheme">${C.verbs.filter(v => v.group === 3).map(v => `<span class="w">${esc(v.inf)}</span>`).join("")}</div>
          <div class="note">Общего правила нет — формы учим наизусть. Открой глагол ниже, чтобы увидеть все формы.</div>`;
      }
      return h + `</div>`;
    }
    if (id === "numbers") {
      return `<div class="rule">
        <div class="rule-h"><span class="badge">11–16</span>отдельные слова</div>
        <div class="scheme">${[11, 12, 13, 14, 15, 16].map(n => `<span class="w">${nword(n)}</span>`).join("")}</div>

        <div class="scheme"><span class="w">10 dix</span><span class="arr">+</span><span class="w">7 sept</span><span class="arr">→</span><span class="w dark">dix-sept</span></div>
        <div class="rule-h"><span class="badge">20–69</span>десяток + единицы</div>
        <div class="scheme">${[20, 30, 40, 50, 60].map(n => `<span class="w">${n} ${nword(n)}</span>`).join("")}</div>
        <div class="scheme"><span class="w">vingt</span><span class="arr">+</span><span class="w">deux</span><span class="arr">→</span><span class="w dark">vingt-deux</span></div>
        <div class="scheme"><span class="w">vingt</span><span class="arr">+</span><span class="w">un</span><span class="arr">→</span><span class="w dark">vingt et un</span></div>
        <div class="note">На конце 1 — <b>et un</b> (21, 31, 41…), в остальных — <b>дефис</b>.</div></div>`;
    }
    if (id === "articles") {
      return `<div class="rule">
        <table class="tbl"><tr><th></th><th>м.р.</th><th>ж.р.</th><th>мн.ч.</th></tr>
          <tr><th>какой-то</th><td>un</td><td>une</td><td>des</td></tr>
          <tr><th>тот самый</th><td>le</td><td>la</td><td>les</td></tr>
          <tr><th>+ гласная</th><td class="hl" colspan="2">l'ami · l'école</td><td>les</td></tr></table>
        <div class="note"><b>un / une</b> — впервые, «какой-то». <b>le / la</b> — конкретный, известный: <i>le secrétaire de Pierre</i>.</div>
        <div class="rule-sep"></div>
        <div class="rule-h"><span class="badge">куда?</span>страны и города</div>
        <div class="prep-row"><div><b>à</b>город</div><div><b>en</b>страна ж.р.</div><div><b>au</b>страна м.р.</div><div><b>aux</b>страна мн.ч.</div></div>
        <div class="note">à Paris · en France · au Canada · aux États-Unis. Страна на <b>-e</b> почти всегда ж.р.</div></div>`;
    }
    if (id === "vocab") {
      return `<div class="rule">
        <div class="rule-h"><span class="badge">совет</span>учим слово сразу с артиклем</div>
        <div class="scheme"><span class="w">un ami</span><span class="arr">↔</span><span class="w">une amie</span><span class="arr">·</span><span class="w">un acteur</span><span class="arr">↔</span><span class="w">une actrice</span></div>
        <div class="note"><b>un</b> = мужской род, <b>une</b> = женский. Выбери тему ниже — тренировки будут только по ней.</div></div>`;
    }
    return `<div class="rule">
      <div class="rule-h"><span class="badge">схемы</span>как строится фраза</div>
      <div class="scheme"><span class="w">C'est un…</span><span class="arr">=</span><span>Это…</span></div>
      <div class="scheme"><span class="w">J'ai une…</span><span class="arr">=</span><span>У меня есть…</span></div>
      <div class="scheme"><span class="w">J'ai 30 ans</span><span class="arr">=</span><span>Мне 30 лет</span></div>
      <div class="scheme"><span class="w">Je vais en…</span><span class="arr">=</span><span>Я еду в…</span></div>
      <div class="scheme"><span class="w">Je travaille comme…</span><span class="arr">=</span><span>Я работаю (кем?)</span></div>
      <div class="note">Фразы собираются случайно из всех слов, которые есть в приложении.</div></div>`;
  }

  function verbDrop(v, open) {
    const ex = v.examples.map(e => exLine(e.fr, e.ru)).join("") + sampleSentences(v.inf, 2).map(s => exLine(s.fr, s.ru)).join("");
    return `<details class="verb"${open ? " open" : ""}><summary><span class="fr">${esc(v.inf)}</span><span class="ru">${esc(v.ru)}</span><span class="gtag ${v.group === 3 ? "g3" : ""}">${["", "I", "II", "III"][v.group]}</span>${ICON.chev}</summary>
      <div class="body"><div class="conj">${["je", "nous", "tu", "vous", "il", "ils", "elle", "elles"].map(p => exLineHtml(pf(p, formOf(v, p)), markPf(v, p), ruOf(v, p))).join("")}</div>
      <div class="sublbl">Примеры</div>${ex}</div></details>`;
  }

  // ================================================================
  //  ЭКРАНЫ
  // ================================================================
  function home() {
    const due = dueKeys().length, n = todayN(), pc = Math.min(100, Math.round(n / GOAL * 100));
    const L = 2 * Math.PI * 34;
    let h = `<div class="top"><div class="logo">A1</div><div><div class="t1">Bonjour !</div><div class="t2">Французский по моей тетради</div></div>
      <div class="stats"><span class="pill" title="Дней подряд">${ICON.fire}${liveStreak()}</span><span class="pill" title="Баллы">${ICON.star}${S.xp}</span></div></div>
      <div class="daily"><div class="ring"><svg viewBox="0 0 78 78"><circle cx="39" cy="39" r="34" fill="none" stroke="#f0e2cf" stroke-width="6"/>
        ${pc ? `<circle cx="39" cy="39" r="34" fill="none" stroke="#17171c" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(L * pc / 100).toFixed(1)} ${L.toFixed(1)}"/>` : ""}</svg><b>${pc}%</b></div>
        <div><h3>Цель дня: ${GOAL} ответов</h3><p>${n >= GOAL ? "Цель выполнена. Bravo !" : `Сегодня ${n}. Ещё ${GOAL - n} до цели.`}</p></div></div>
      <div class="row-h"><h2>Разделы</h2></div><div class="bento">`;
    const shape = ["tall", "", "", "", ""];
    SECTIONS.forEach((s, i) => {
      const m = mastery(s);
      h += `<button class="tile ${shape[i]}" data-sec="${s.id}" style="--a:${s.a}">${art(s.b, s.seed, i % 3, 200, shape[i] === "tall" ? 250 : 120)}
        <span class="fr-t">${s.fr}</span><span class="lbl"><b>${s.short || s.title}</b><span>${m.pc}%</span></span></button>`;
    });
    h += `<button class="tile wide" id="bigtest" style="--a:var(--ink)">${art("var(--lime)", 77, 1, 400, 120)}<span class="fr-t">le test</span><span class="lbl"><b style="color:#fff">Общий тест</b><span>${SIZE}</span></span></button>`;
    h += `</div><button class="linkbtn" id="reset">Сбросить прогресс</button>`;
    $app.innerHTML = h;
    $app.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => section(b.dataset.sec));
    $("#bigtest").onclick = runBigTest;
    $("#reset").onclick = confirmReset;
    showDock("", `<div class="two"><button class="btn ghost" id="rev">${due ? `Ошибки · ${due}` : "Повторение"}</button><button class="btn" id="bt">Общий тест</button></div>`);
    $("#rev").onclick = startRevision;
    $("#bt").onclick = runBigTest;
    window.scrollTo(0, 0);
  }

  function confirmReset() {
    showDock("fb", `<div class="fb-h">Сбросить весь прогресс?</div><div class="fb-why">Баллы, серия дней и ошибки для повторения удалятся.</div>
      <div class="two"><button class="btn ghost" id="no">Отмена</button><button class="btn" id="yes">Сбросить</button></div>`);
    $("#no").onclick = home;
    $("#yes").onclick = () => { S = blank(); save(); home(); };
  }

  function section(id) {
    const s = SEC[id], m = mastery(s);
    let h = `<div class="hero" style="--a:${s.a}">${art(s.b, s.seed + 7, 2, 400, 170)}
        <div class="bar-top"><button class="round" id="bk" aria-label="Назад">${ICON.back}</button><h1 class="fr">${s.fr}</h1></div></div>
      <div class="sheet"><h2>${s.title}</h2><div class="sub">Освоено ${m.ok} из ${m.total}${m.unit ? " " + m.unit : ""}</div><div class="meter"><i style="width:${m.pc}%"></i></div>`;
    if (id === "verbs") h += chips("vg", [[0, "Все"], [1, "I группа"], [2, "II"], [3, "III"]]);
    if (id === "numbers") h += chips("nr", [["all", `1–${NMAX}`], ["1-20", "1–20"], ["21-69", `21–${NMAX}`]]);
    if (id === "vocab") h += chips("vt", [["", "Все темы"], ...C.themes.map(t => [t, t])]);
    h += ruleCard(id);
    h += `<h3 class="h-sm">Тренировки</h3><div class="list">`;
    s.drills.forEach((d, i) => { const empty = !d.keys().length;
      h += row({ ...d, best: S.best[d.id], d: empty ? "Пока пусто для этого фильтра" : d.d }, s, d.id, i, false, empty); });
    (C.lessons[id] || []).forEach((l, i) => { const r = S.lessons[l.id];
      h += row({ t: l.title, d: `Урок «${l.ru || ""}» · ${l.exercises.length} заданий`, icon: "puzzle", best: r && r.best }, s, "L:" + l.id, 7 + i, true); });
    h += row({ t: "Шпаргалка", d: "Все правила и таблицы со звуком", icon: "book" }, s, "cheat", 9);
    h += `</div>`;
    if (id === "verbs") h += `<h3 class="h-sm">Мои глаголы</h3><p class="muted" style="margin:0 0 10px;font-size:14px">Нажми на глагол — откроются все формы.</p>` + vList().map(v => verbDrop(v)).join("");
    h += `</div>`;
    $app.innerHTML = h;
    $("#bk").onclick = home;
    $app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { const v = b.dataset.v; S.prefs[b.dataset.f] = v !== "" && !isNaN(+v) ? +v : v; save(); section(id); });
    $app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
      const g = b.dataset.go;
      if (g === "cheat") return cheat(id);
      if (g.startsWith("L:")) return openLesson(id, C.lessons[id].find(l => l.id === g.slice(2)));
      runDrill(id, g);
    });
    showDock("", `<button class="btn" id="mix">Смешанный тест по разделу · ${SIZE}</button>`);
    $("#mix").onclick = () => runMix(id);
    window.scrollTo(0, 0);
  }

  function row(d, s, go, i, isLesson, disabled) {
    const colors = [s.a, s.b, "var(--pink)", "var(--yellow)", "var(--mint)", "var(--coral)"];
    const a = colors[i % colors.length], b = colors[(i + 2) % colors.length];
    const best = d.best != null ? `<span class="best">лучший результат ${Math.round(d.best * 100)}%</span>` : "";
    const lvl = d.lvl ? `<span class="lvl l${d.lvl}">${LVL[d.lvl]}${best}</span>` : isLesson && d.best != null ? `<span class="lvl l1">Пройден${best}</span>` : "";
    return `<button class="item" data-go="${go}" ${disabled ? "disabled" : ""}><span class="thumb" style="--a:${a}">${art(b, s.seed + i * 5, i % 3, 80, 80)}<span class="ic">${ICON[d.icon]}</span></span>
      <span><span class="tt">${esc(d.t)}</span><div class="dd">${esc(d.d)}</div>${lvl}</span></button>`;
  }

  function chips(key, opts) {
    const cur = S.prefs[key] ?? opts[0][0];
    return `<div class="chips">` + opts.map(([v, t]) => `<button data-f="${key}" data-v="${esc(v)}" class="${cur == v ? "on" : ""}">${esc(t)}</button>`).join("") + `</div>`;
  }

  // ---------- шпаргалка ----------
  const exLine = (fr, ru) => `<div class="ex">${sayBtn(fr)}<div><div class="fr">${esc(fr)}</div>${ru ? `<div class="ru">${esc(ru)}</div>` : ""}</div></div>`;
  const exLineHtml = (fr, html, ru) => `<div class="ex">${sayBtn(fr)}<div><div class="fr">${html}</div>${ru ? `<div class="ru">${esc(ru)}</div>` : ""}</div></div>`;
  const blocks = bl => bl.map(b => b.t === "ex" ? exLine(b.fr, b.ru) : `<div class="blk">${b.ru}</div>`).join("");

  function cheat(id) {
    const s = SEC[id];
    let h = `<div class="ex-top"><button class="round" id="bk" aria-label="Назад">${ICON.back}</button><h2 style="font-size:24px">Шпаргалка · ${s.title}</h2></div>` + ruleCard(id) + `<div class="cards">`;
    if (id === "verbs") {
      h += `<div>${C.verbs.map(v => verbDrop(v)).join("")}</div>`;
    } else if (id === "numbers") {
      let g = ""; for (let n = 1; n <= NMAX; n++) g += `<button data-num="${n}">${n}</button>`;
      h += `<div class="card"><div class="numsay" id="numsay"><span class="muted">Нажми на число — услышишь, как оно звучит</span></div><div class="numgrid">${g}</div></div>`;
    } else if (id === "articles") {
      h += `<div class="card"><h3>Из конспекта</h3>${C.articles.sentences.map(x => exLine(x.fr, x.ru)).join("")}</div>
        <div class="card"><h3>Страны и города</h3>${["city", "f", "m", "pl"].map(k => C.places.filter(p => p.kind === k).map(p => `<div class="vrow">${sayBtn(`${PREP[k]} ${p.name}`)}<span class="fr">${PREP[k]} ${esc(p.name)}</span><span class="ru">${esc(p.ru)}</span></div>`).join("")).join("")}</div>
        <div class="card"><h3>Слова с артиклями</h3>${artNouns().map(n => `<div class="vrow">${sayBtn(withDef(defOf(n), n.w))}<span class="fr">${indefOf(n)} ${esc(n.w)} · ${esc(withDef(defOf(n), n.w))}</span><span class="ru">${esc(n.ru)}</span></div>`).join("")}</div>`;
    } else if (id === "vocab") {
      C.themes.forEach(t => {
        const ws = VOCAB.filter(w => w.theme === t); if (!ws.length) return;
        h += `<div class="card"><h3>${esc(t)}</h3>${ws.map(w => `<div class="vrow">${sayBtn(w.fr)}<span class="fr">${esc(w.fr)}</span><span class="ru">${esc(w.ru)}</span></div>`).join("")}</div>`;
      });
      (C.lessons.vocab || []).forEach(l => { h += `<div class="card"><h3 class="fr">${esc(l.title)}</h3>${blocks(l.rule)}</div>`; });
    } else {
      h += `<div class="card"><h3>Примеры</h3>${Object.keys(TPL).map(t => { const T = TPL[t], x = T.build(T.make()); return x ? exLine(x.fr, x.ru) : ""; }).join("")}</div>`;
    }
    h += `</div>`;
    $app.innerHTML = h;
    hideDock();
    $("#bk").onclick = () => section(id);
    $app.querySelectorAll("[data-num]").forEach(b => b.onclick = () => {
      const n = +b.dataset.num; speak(String(n));
      $app.querySelectorAll("[data-num]").forEach(x => x.classList.toggle("on", x === b));
      $("#numsay").innerHTML = `${sayBtn(String(n))}<span class="fr">${n} — ${esc(nword(n))}</span>`;
    });
    window.scrollTo(0, 0);
  }

  // ---------- сессии ----------
  const SIZE = 12;
  function buildSet(keys, modes, n = SIZE) {
    const out = [], seen = new Set();
    const weighted = keys.flatMap(k => S.srs[k] ? [k, k, k] : [k]);
    if (!weighted.length) return out;
    for (let tries = 0; out.length < n && tries < 300; tries++) {
      const ex = exFor(pick(weighted), modes);
      if (!ex) continue;
      const sig = JSON.stringify([ex.type, ex.prompt, ex.audio, ex.pairs && ex.pairs.map(p => p[0]).sort(), ex.words, ex.answer]);
      if (seen.has(sig)) continue;
      seen.add(sig); out.push(ex);
    }
    return out;
  }
  function runDrill(secId, did) {
    const s = SEC[secId], d = s.drills.find(x => x.id === did);
    const set = buildSet(d.keys(), d.modes); if (!set.length) return;
    startSession(set, { title: d.t, sec: s, drill: d.id, back: () => section(secId), again: () => runDrill(secId, did) });
  }
  function mixFrom(drills, n) {
    const per = Math.max(2, Math.ceil(n / drills.length) + 1);
    return shuffle(drills.filter(d => d.keys().length).flatMap(d => buildSet(d.keys(), d.modes, per))).slice(0, n);
  }
  function runMix(secId) {
    const s = SEC[secId];
    const set = mixFrom(s.drills, SIZE); if (!set.length) return;
    startSession(set, { title: "Смешанный тест", sec: s, back: () => section(secId), again: () => runMix(secId) });
  }
  function runBigTest() {
    const set = shuffle(SECTIONS.flatMap(s => mixFrom(s.drills.filter(d => d.lvl < 3), 3))).slice(0, SIZE);
    startSession(set, { title: "Общий тест", back: home, again: runBigTest });
  }
  function openLesson(secId, l) {
    const s = SEC[secId];
    $app.innerHTML = `<div class="ex-top"><button class="round" id="bk" aria-label="Назад">${ICON.back}</button><h2 style="font-size:24px" class="fr">${esc(l.title)}</h2></div>
      <div class="card">${blocks(l.rule)}</div>`;
    $("#bk").onclick = () => section(secId);
    showDock("", `<button class="btn" id="go">Начать · ${l.exercises.length} заданий</button>`);
    $("#go").onclick = () => startSession(l.exercises.map(ex => ({ ...ex, key: "L|" + ex.id })), { title: l.title, sec: s, lesson: l, back: () => section(secId), again: () => openLesson(secId, l) });
    window.scrollTo(0, 0);
  }
  function startRevision() {
    let set = dueKeys().sort((a, b) => S.srs[a].box - S.srs[b].box).slice(0, SIZE).map(k => exFor(k)).filter(Boolean), revision = true;
    if (!set.length) {
      const seen = Object.keys(S.items).filter(k => exFor(k));
      set = seen.length >= 6 ? buildSet(seen, ["conjc", "pron", "end", "order", "fr2ru", "ru2fr", "hearc", "w2d", "gender", "indef", "def", "prep", "art1", "hear", "fill"]) : mixFrom(SECTIONS.flatMap(s => s.drills.filter(d => d.lvl === 1)), SIZE);
      revision = false;
    }
    startSession(set, { title: "Повторение", revision, back: home, again: startRevision });
  }

  let R = null;
  function startSession(list, opt) {
    R = { queue: list.map(ex => ({ ex, retry: false })), total: list.length, done: 0, firstOk: 0, xp: 0, missed: new Set(), ...opt };
    next();
  }

  function next() {
    if (!R.queue.length) return finish();
    const { ex, retry } = R.queue[0];
    const ruQ = /[а-яё]/i.test(ex.prompt);
    const acc = R.sec ? R.sec.a : "var(--lime)";
    let h = `<div class="ex-top"><button class="round" id="x" aria-label="Выйти">${ICON.close}</button>
      <div class="prog"><i style="width:${R.done / R.total * 100}%"></i></div><span class="count">${R.done}/${R.total}</span></div>
      <span class="kind" style="--a:${acc}">${esc(ex.kind)}${retry ? " · ещё раз" : ""}</span>`;
    if (ex.ask) h += `<div class="ask">${esc(ex.ask)}</div>`;
    if (ex.audio) h += `<div class="listen"><button class="play" data-say="${esc(ex.audio)}">${ICON.speak}Слушать</button>
      <button class="play slow" data-say="${esc(ex.audio)}" data-slow="1" aria-label="Медленно">0.6×</button></div>`;
    if (ex.prompt) h += `<div class="qwrap"><div class="q ${ruQ ? "ru" : ""}">${esc(ex.prompt)}</div>${ex.ru && !ruQ && !ex.noRu ? `<div class="q-ru">${esc(ex.ru)}</div>` : ""}</div>`;
    h += `<div id="work"></div>`;
    if (ex.audio && !hasTTS) h += `<p class="muted">Этот браузер не умеет озвучивать текст.</p>`;
    $app.innerHTML = h;
    $("#x").onclick = () => { if (hasTTS) speechSynthesis.cancel(); R.back(); };
    RENDER[ex.type](ex, $("#work"));
    if (ex.audio) setTimeout(() => speak(ex.audio), 250);
    window.scrollTo(0, 0);
  }

  function checkDock(onCheck) {
    showDock("", `<button class="btn" id="chk" disabled>Проверить<span class="kbd">Enter</span></button>`);
    const b = $("#chk"); b.onclick = onCheck; return b;
  }

  function grade(ok, correct, note, hinted) {
    const it = R.queue.shift(), ex = it.ex, k = ex.key;
    enterLock = Date.now() + 400;
    if (k) { S.items[k] = S.items[k] || { ok: 0, bad: 0 }; S.items[k][ok ? "ok" : "bad"]++; }
    if (ok) {
      touchDay();
      const gain = it.retry || hinted ? 5 : 10; S.xp += gain; R.xp += gain;
      if (!it.retry && !hinted) R.firstOk++;
      R.done++;
      if (k && R.revision && !R.missed.has(k)) srsRight(k);
    } else {
      if (k) { srsWrong(k); R.missed.add(k); }
      R.queue.push({ ex, retry: true });
    }
    save();
    const sayText = ex.say ?? ex.answer ?? "";
    const title = ok ? (note ? "Почти!" : hinted ? "Верно, с подсказкой" : pick(["Верно!", "Bravo !", "Super !", "Très bien !"])) : "Не совсем";
    let body = "";
    if (!ok && correct && !ex.say) body += `<div class="fb-ans"><div class="fr">${correct}</div></div>`;
    if (sayText) body += `<div class="fb-ans">${sayBtn(sayText)}<div><div class="fr">${ex.sayHtml || esc(sayText)}</div>${ex.sayRu ? `<div class="ru">${esc(ex.sayRu)}</div>` : ""}</div></div>`;
    if (note) body += `<div class="fb-why">${note}</div>`;
    if (ex.explain) body += `<div class="fb-why">${ex.explain}</div>`;
    showDock("fb " + (ok ? "ok" : "bad"), `<div class="fb-h">${title}</div>${body}<button class="btn" id="nx">Дальше<span class="kbd">Enter</span></button>`);
    $("#nx").onclick = () => next();
    speak(sayText);
  }

  function finish() {
    const pct = R.total ? R.firstOk / R.total : 1;
    if (R.lesson) { const p = S.lessons[R.lesson.id]; S.lessons[R.lesson.id] = { best: Math.max(pct, p ? p.best : 0) }; }
    if (R.drill) S.best[R.drill] = Math.max(pct, S.best[R.drill] || 0);
    S.xp += 20; R.xp += 20; save();
    const s = R.sec || { a: "var(--ink)", b: "var(--lime)", seed: 5 };
    $app.innerHTML = `<div class="result" style="--a:${s.a}">${art(s.b, s.seed + 99, 1, 400, 240)}<div class="big"><b>${Math.round(pct * 100)}%</b><span>с первой попытки</span></div></div>
      <h2 class="res-h fr">${pct === 1 ? "Parfait !" : pct >= 0.7 ? "Très bien !" : "Bien !"}</h2>
      <p class="res-p">+${R.xp} баллов${R.missed.size ? ` · ошибки (${R.missed.size}) попадут в повторение` : ""}</p>`;
    showDock("", `<div class="two"><button class="btn ghost" id="bk">Назад</button><button class="btn" id="ag">Новый тест</button></div>`);
    $("#bk").onclick = R.back; $("#ag").onclick = R.again;
    enterLock = Date.now() + 400;
  }

  function showDock(cls, html) { $dock.className = "dock" + (cls ? " " + cls : ""); $dockIn.innerHTML = html; $dock.hidden = false; }
  function hideDock() { $dock.hidden = true; $dockIn.innerHTML = ""; }

  // ---------- типы заданий ----------
  const RENDER = {
    choice(ex, w) {
      let sel = null;
      w.innerHTML = `<div class="opts">` + shuffle(uniq(ex.options)).map((o, i) => `<button class="opt" data-o="${esc(o)}"><span class="k">${i + 1}</span>${esc(o)}</button>`).join("") + `</div>`;
      const btns = [...w.querySelectorAll(".opt")];
      const chk = checkDock(() => {
        btns.forEach(b => { b.disabled = true; b.classList.remove("sel"); if (b.dataset.o === ex.answer) b.classList.add("ok"); else if (b.dataset.o === sel) b.classList.add("bad"); });
        grade(sel === ex.answer, esc(ex.answer));
      });
      btns.forEach(b => b.onclick = () => { sel = b.dataset.o; btns.forEach(x => x.classList.toggle("sel", x === b)); chk.disabled = false; });
    },

    input(ex, w) {
      let hinted = false;
      w.innerHTML = `<input class="field" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" ${ex.digits ? 'inputmode="numeric" placeholder="Цифрами"' : 'placeholder="По-французски"'}>
        <div class="tools">${ex.digits ? "" : ["é", "è", "ê", "à", "ç", "œ", "'", "-"].map(c => `<button data-c="${c}" type="button">${c}</button>`).join("")}<button class="hint" type="button" id="hint">Подсказка</button></div>`;
      const inp = w.querySelector("#inp");
      const chk = checkDock(() => {
        if (!inp.value.trim() || inp.disabled) return;
        inp.disabled = true;
        const v = inp.value;
        if (ex.answers.some(a => norm(a) === norm(v))) return grade(true, null, null, hinted);
        if (ex.answers.some(a => bare(a) === bare(v))) return grade(true, null, "Проверь значки над буквами.", hinted);
        grade(false, esc(ex.answers[0]));
      });
      const sync = () => chk.disabled = !inp.value.trim();
      inp.oninput = sync;
      w.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
        const p = inp.selectionStart ?? inp.value.length;
        inp.value = inp.value.slice(0, p) + b.dataset.c + inp.value.slice(inp.selectionEnd ?? p);
        inp.focus(); inp.setSelectionRange(p + 1, p + 1); sync();
      });
      w.querySelector("#hint").onclick = () => {
        const a = ex.answers[0]; let i = 0;
        while (i < inp.value.length && i < a.length && inp.value[i].toLowerCase() === a[i].toLowerCase()) i++;
        inp.value = a.slice(0, i + 1); hinted = true; inp.focus(); sync();
      };
      if (!matchMedia("(pointer: coarse)").matches) inp.focus();
    },

    order(ex, w) {
      const answer = ex.tokens.join(" ");
      let bank = shuffle(ex.tokens.map((t, i) => ({ t, i })));
      if (bank.map(b => b.t).join(" ") === answer && bank.length > 1) bank = bank.slice(1).concat(bank[0]);
      const picked = [];
      w.innerHTML = `<div class="tray" id="tray"></div><div class="bank" id="bank"></div>`;
      const tray = w.querySelector("#tray"), bk = w.querySelector("#bank");
      const chk = checkDock(() => {
        w.querySelectorAll(".tok").forEach(b => b.disabled = true);
        grade(norm(picked.map(p => p.t).join(" ")) === norm(answer), esc(answer));
      });
      const draw = () => {
        tray.innerHTML = picked.map(p => `<button class="tok" data-i="${p.i}">${esc(p.t)}</button>`).join("");
        bk.innerHTML = bank.map(p => `<button class="tok${picked.includes(p) ? " used" : ""}" data-i="${p.i}">${esc(p.t)}</button>`).join("");
        tray.querySelectorAll(".tok").forEach(b => b.onclick = () => { picked.splice(picked.findIndex(p => p.i == b.dataset.i), 1); draw(); });
        bk.querySelectorAll(".tok:not(.used)").forEach(b => b.onclick = () => { speak(b.textContent.replace(/[.?!]/g, "")); picked.push(bank.find(p => p.i == b.dataset.i)); draw(); });
        chk.disabled = picked.length !== ex.tokens.length;
      };
      draw();
    },

    find(ex, w) {
      let sel = null;
      w.innerHTML = `<div class="words">` + ex.words.map((t, i) => `<button class="opt" data-i="${i}">${esc(t)}</button>`).join("") + `</div>`;
      const btns = [...w.querySelectorAll(".opt")];
      const chk = checkDock(() => {
        btns.forEach(b => { b.disabled = true; b.classList.remove("sel"); if (+b.dataset.i === ex.wrong) b.classList.add("bad"); });
        grade(sel === ex.wrong);
      });
      btns.forEach(b => b.onclick = () => { sel = +b.dataset.i; btns.forEach(x => x.classList.toggle("sel", x === b)); chk.disabled = false; });
    },

    match(ex, w) {
      const left = shuffle(ex.pairs.map(p => p[0])), right = shuffle(ex.pairs.map(p => p[1]));
      const map = Object.fromEntries(ex.pairs);
      let cur = null, errors = 0, matched = 0;
      w.innerHTML = `<div class="match"><div class="col">${left.map(l => `<button class="opt" data-l="${esc(l)}">${esc(l)}</button>`).join("")}</div>
        <div class="col">${right.map(r => `<button class="opt" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>`;
      showDock("", `<div class="hint-line">Нажми слева, потом справа</div>`);
      w.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
        w.querySelectorAll("[data-l]").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); cur = b; speak(b.dataset.l);
      });
      w.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
        if (!cur) return;
        if (map[cur.dataset.l] === b.dataset.r) {
          [cur, b].forEach(x => { x.classList.remove("sel"); x.classList.add("ok"); x.disabled = true; });
          cur = null;
          if (++matched === ex.pairs.length) grade(errors === 0, "", errors ? `Ошибок: ${errors}.` : null);
        } else {
          errors++;
          [cur, b].forEach(x => { x.classList.remove("shake"); void x.offsetWidth; x.classList.add("shake"); });
        }
      });
    },

    open(ex, w) {
      w.innerHTML = `<textarea class="field" id="inp" placeholder="Твой ответ по-французски" spellcheck="false"></textarea><div id="refs"></div>`;
      const inp = w.querySelector("#inp");
      showDock("", `<button class="btn" id="show">Сравнить с образцом</button>`);
      $("#show").onclick = () => {
        inp.disabled = true;
        w.querySelector("#refs").innerHTML = `<div class="card refs">${ex.refs.map(r => exLine(r)).join("")}</div>`;
        showDock("", `<div class="two"><button class="btn ghost" id="no">Не совпало</button><button class="btn" id="yes">Совпадает</button></div>`);
        $("#yes").onclick = () => grade(true);
        $("#no").onclick = () => grade(false, ex.refs.map(esc).join(" / "));
      };
    }
  };

  home();
})();
</script>
