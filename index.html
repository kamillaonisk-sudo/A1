<!--
  ============================================================
  КОНТЕНТ (только из конспектов).
  Чтобы добавить раздел — допиши объект в COURSE.sections.
  Логика приложения ниже контент не трогает.
  ============================================================
-->
<script>
window.COURSE = {
  sections: [
    {
      id: "aller",
      title: "ALLER",
      gloss: "идти / ехать",
      lessons: [
        {
          id: "aller-1",
          title: "Спряжение",
          rule: [
            { t: "text", ru: "<b>aller</b> — идти / ехать. Глагол III группы." },
            { t: "note", ru: "единственное исключение" },
            { t: "conj", rows: [["je vais", "nous allons"], ["tu vas", "vous allez"], ["il va", "ils vont"]] }
          ],
          exercises: [
            { id: "a1-1", type: "match", kind: "Соедини пары",
              prompt: "Соедини местоимение и форму глагола aller",
              pairs: [["je", "vais"], ["tu", "vas"], ["il", "va"], ["nous", "allons"], ["vous", "allez"], ["ils", "vont"]],
              explain: "Спряжение aller: je vais, tu vas, il va, nous allons, vous allez, ils vont." },
            { id: "a1-2", type: "choice", kind: "Выбери ответ",
              prompt: "nous ___", options: ["allons", "allez", "vont", "vais"], answer: "allons",
              explain: "nous → <b>allons</b>. Форма allez — для vous." },
            { id: "a1-3", type: "input", kind: "Спрягай глагол",
              prompt: "aller: vous ___", answers: ["allez"],
              explain: "vous → <b>allez</b>." },
            { id: "a1-4", type: "input", kind: "Спрягай глагол",
              prompt: "aller: ils ___", answers: ["vont"],
              explain: "ils → <b>vont</b>. Не путай с il → va." },
            { id: "a1-5", type: "choice", kind: "Выбери по контексту",
              prompt: "Tu ___ à Paris.", options: ["vas", "va", "vais"], answer: "vas",
              explain: "tu → <b>vas</b>. va — для il, vais — для je." },
            { id: "a1-6", type: "choice", kind: "Что ты услышала?", audio: "il va",
              prompt: "Послушай и выбери", options: ["je vais", "tu vas", "il va"], answer: "il va",
              explain: "Прозвучало <b>il va</b>." },
            { id: "a1-7", type: "find", kind: "Найди ошибку",
              prompt: "Нажми на слово с ошибкой", words: ["Nous", "allez", "en", "France."], wrong: 1, fix: "allons",
              explain: "nous → <b>allons</b>. allez — это форма для vous." },
            { id: "a1-8", type: "input", kind: "Исправь ошибку",
              prompt: "Ils va à Paris.", answers: ["Ils vont à Paris."],
              explain: "ils → <b>vont</b>. va — это форма для il." },
            { id: "a1-9", type: "input", kind: "Диктант", audio: "nous allons",
              prompt: "Послушай и запиши", answers: ["nous allons"],
              explain: "nous <b>allons</b>." }
          ]
        },
        {
          id: "aller-2",
          title: "Je vais en France",
          rule: [
            { t: "text", ru: "Примеры из конспекта:" },
            { t: "ex", fr: "Je vais en France." },
            { t: "ex", fr: "Il va à Paris." },
            { t: "note", ru: "en France · à Paris" }
          ],
          exercises: [
            { id: "a2-1", type: "choice", kind: "Выбери предлог",
              prompt: "Je vais ___ France.", options: ["en", "à"], answer: "en",
              explain: "Как в конспекте: Je vais <b>en</b> France." },
            { id: "a2-2", type: "choice", kind: "Выбери предлог",
              prompt: "Il va ___ Paris.", options: ["en", "à"], answer: "à",
              explain: "Как в конспекте: Il va <b>à</b> Paris." },
            { id: "a2-3", type: "order", kind: "Собери предложение",
              prompt: "Собери фразу из конспекта", tokens: ["Il", "va", "à", "Paris."],
              explain: "Il va à Paris." },
            { id: "a2-4", type: "choice", kind: "Выбери предлог",
              prompt: "Nous allons ___ Paris.", options: ["en", "à"], answer: "à",
              explain: "Paris → <b>à</b> Paris, как в «Il va à Paris»." },
            { id: "a2-5", type: "choice", kind: "Переведи ключевое слово",
              prompt: "идти / ехать", options: ["aller", "avoir"], answer: "aller",
              explain: "В конспекте: ALLER — идти / ехать." },
            { id: "a2-6", type: "choice", kind: "Аудирование", audio: "Je vais en France.",
              prompt: "Послушай и выбери фразу", options: ["Je vais en France.", "Il va à Paris.", "Ils vont à Paris."], answer: "Je vais en France.",
              explain: "Прозвучало: Je vais en France." },
            { id: "a2-7", type: "choice", kind: "Выбери предлог",
              prompt: "Vous allez ___ France.", options: ["en", "à"], answer: "en",
              explain: "France → <b>en</b> France, как в «Je vais en France»." },
            { id: "a2-8", type: "input", kind: "Диктант", audio: "Il va à Paris.",
              prompt: "Послушай и запиши", answers: ["Il va à Paris."],
              explain: "Il va à Paris." },
            { id: "a2-9", type: "order", kind: "Поставь слова по порядку",
              prompt: "Собери фразу из конспекта", tokens: ["Je", "vais", "en", "France."],
              explain: "Je vais en France." }
          ]
        },
        {
          id: "aller-3",
          title: "Comment ça va ?",
          rule: [
            { t: "text", ru: "Спрашиваем «как дела?»:" },
            { t: "ex", fr: "Comment vas-tu ?" },
            { t: "ex", fr: "Comment allez-vous ?" },
            { t: "ex", fr: "Comment va-t-il ?" },
            { t: "note", ru: "va-t-il — t выделен · comment‿allez-vous" },
            { t: "text", ru: "Ответ: <b>Je vais</b> super / très bien / bien / mal." },
            { t: "text", ru: "Безлично (ça va — «это идёт»):" },
            { t: "ex", fr: "Comment ça va ?" },
            { t: "ex", fr: "Ça va ?" },
            { t: "text", ru: "Ответ: ça va ___ / comme ci, comme ça / ça va aller." }
          ],
          exercises: [
            { id: "a3-1", type: "choice", kind: "Закончи диалог",
              prompt: "— Comment vas-tu ?\n— Je ___ bien.", options: ["vais", "vas", "va"], answer: "vais",
              explain: "Отвечаем о себе: je → <b>vais</b>. Je vais bien." },
            { id: "a3-2", type: "input", kind: "Вставь пропуск",
              prompt: "Comment va-_-il ?", answers: ["t"],
              explain: "В конспекте: comment va-<b>t</b>-il ? — буква t выделена." },
            { id: "a3-3", type: "choice", kind: "Выбери по контексту",
              prompt: "Как спросить «как дела?» безлично?", options: ["Comment ça va ?", "Comment vas-tu ?", "Comment allez-vous ?"], answer: "Comment ça va ?",
              explain: "Безлично: <b>comment ça va ?</b> или <b>ça va ?</b>" },
            { id: "a3-4", type: "order", kind: "Собери предложение",
              prompt: "Ответь, что всё очень хорошо", tokens: ["Je", "vais", "très", "bien."],
              explain: "Je vais très bien." },
            { id: "a3-5", type: "choice", kind: "Закончи диалог",
              prompt: "— Ça va ?\n— ___", options: ["Comme ci, comme ça.", "Comment vas-tu ?", "Il va à Paris."], answer: "Comme ci, comme ça.",
              explain: "На «Ça va ?» отвечают: ça va ___ / comme ci, comme ça / ça va aller." },
            { id: "a3-6", type: "choice", kind: "Что ты услышала?", audio: "Comment allez-vous ?",
              prompt: "Послушай и выбери", options: ["Comment allez-vous ?", "Comment vas-tu ?", "Comment va-t-il ?"], answer: "Comment allez-vous ?",
              explain: "Прозвучало: comment allez-vous ? — со связкой comment‿allez." },
            { id: "a3-7", type: "input", kind: "Переформулируй",
              prompt: "Спроси то же самое безлично:\nComment vas-tu ?", answers: ["Comment ça va ?", "Ça va ?"],
              explain: "Безлично: <b>Comment ça va ?</b> или <b>Ça va ?</b>" },
            { id: "a3-8", type: "input", kind: "Переведи фразу",
              prompt: "«это идёт» (безлично)", answers: ["ça va"],
              explain: "В конспекте: ça va — «это идёт»." },
            { id: "a3-9", type: "open", kind: "Ответь своими словами",
              prompt: "Comment vas-tu ?", refs: ["Je vais super.", "Je vais très bien.", "Je vais bien.", "Je vais mal."],
              explain: "Ответ по конспекту: Je vais super / très bien / bien / mal." },
            { id: "a3-10", type: "input", kind: "Диктант", audio: "Comme ci, comme ça.",
              prompt: "Послушай и запиши", answers: ["Comme ci, comme ça."],
              explain: "Comme ci, comme ça." }
          ]
        }
      ]
    }
  ],
  // Темы из тетради, которые ещё не собраны в уроки
  upcoming: [
    { title: "AVOIR", gloss: "j'ai, tu as… · J'ai 29 ans." },
    { title: "Числа 11–60", gloss: "onze… soixante" },
    { title: "Артикли", gloss: "un, une, des · le, la, l', les" },
    { title: "Притяжательные", gloss: "mon, ton, son · notre, votre, leur" }
  ]
};
</script>

<style>

  font: 16px/1.5 "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-inline: 16px;
}

.fr { font-family: "Rubik", system-ui, sans-serif; font-weight: 500; }

/* Top stats */

/* Home */
.revise { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 0;

.lesson:hover { border-color: var(--blue); }

.lesson.done .dot { background: var(--green); color: #fff; }

/* Lesson top */

.prompt { font-size: 24px; line-height: 1.35; white-space: pre-line; margin-bottom: 20px; font-weight: 700; }
.prompt.ru { font-family: "Onest", sans-serif; font-weight: 600; font-size: 19px; }
.audio-row { display: flex; gap: 10px; margin-bottom: 20px; }

<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>

<script>
(() => {
  const C = window.COURSE;
  const $app = document.getElementById("app");
  const $dock = document.getElementById("dock");
  const $dockIn = document.getElementById("dockIn");

  const ICON = {
    fire: '<svg viewBox="0 0 24 24" fill="#f39a12"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="#2346e0"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>',
    speak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
    repeat: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg>'
  };

  // ---------- storage ----------
  const KEY = "cahierA1.v1";
  const blank = () => ({ xp: 0, streak: 0, lastDay: null, lessons: {}, srs: {} });
  let S = blank();
  try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const dayStr = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return dayStr(d); };
  function touchDay() {
    const today = dayStr();
    if (S.lastDay === today) return;
    S.streak = S.lastDay === addDays(-1) ? S.streak + 1 : 1;
    S.lastDay = today;
  }
  function liveStreak() { return (S.lastDay === dayStr() || S.lastDay === addDays(-1)) ? S.streak : 0; }

  // Leitner boxes: 1→1 день, 2→2, 3→4, 4→7, потом выучено
  const GAPS = [1, 2, 4, 7];
  function srsWrong(id) { S.srs[id] = { box: 0, due: dayStr() }; }
  function srsRight(id) {
    const it = S.srs[id]; if (!it) return;
    it.box++;
    if (it.box > GAPS.length) delete S.srs[id]; else it.due = addDays(GAPS[it.box - 1]);
  }
  const dueIds = () => Object.keys(S.srs).filter(id => S.srs[id].due <= dayStr() && EX[id]);

  // index of exercises
  const EX = {};
  C.sections.forEach(sec => sec.lessons.forEach(l => l.exercises.forEach(ex => { EX[ex.id] = { ex, lesson: l }; })));

  // ---------- helpers ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const norm = s => String(s).toLowerCase().replace(/[’`]/g, "'").replace(/[.,!?«»;:]/g, " ").replace(/\s*-\s*/g, "-").replace(/\s+/g, " ").trim();
  const bare = s => norm(s).normalize("NFD").replace(/[̀-ͯ]/g, "");

  // ---------- speech ----------
  let frVoice = null;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    const vs = speechSynthesis.getVoices();
    frVoice = vs.find(v => /^fr[-_]FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, slow) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; if (frVoice) u.voice = frVoice;
    u.rate = slow ? 0.6 : 0.9;
    speechSynthesis.speak(u);
  }
  const sayBtn = text => `<button class="say" data-say="${esc(text)}" aria-label="Послушать">${ICON.speak}</button>`;
  document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say, b.dataset.slow === "1"); });

  // ---------- HOME ----------
  function home() {
    hideDock();
    const due = dueIds().length;
    let h = `<div class="stats"><div class="brand">Cahier <span>A1</span></div>
      <div class="chips"><span class="chip" title="Серия дней">${ICON.fire}${liveStreak()}</span><span class="chip" title="Баллы">${ICON.star}${S.xp}</span></div></div>
      <button class="revise" id="rev">${ICON.repeat}<span><b>Révision</b><small>${due ? "Ошибки, которые пора повторить" : "Сегодня повторять нечего"}</small></span><span class="count">${due}</span></button>`;
    C.sections.forEach(sec => {
      const done = sec.lessons.filter(l => S.lessons[l.id]).length;
      h += `<p class="label">Раздел</p><div class="section"><div class="section-head"><h2>${esc(sec.title)}</h2><span class="hand">${esc(sec.gloss)}</span></div>
        <div class="bar" aria-label="Пройдено ${done} из ${sec.lessons.length}"><i style="width:${done / sec.lessons.length * 100}%"></i></div><div class="lessons">`;
      sec.lessons.forEach((l, i) => {
        const r = S.lessons[l.id];
        h += `<button class="lesson${r ? " done" : ""}" data-lesson="${l.id}"><span class="dot">${r ? "✓" : i + 1}</span>
          <span><span class="t fr">${esc(l.title)}</span><br><span class="s">${l.exercises.length} заданий${r ? " · лучший результат " + Math.round(r.best * 100) + "%" : ""}</span></span></button>`;
      });
      h += `</div></div>`;
    });
    if (C.upcoming && C.upcoming.length) {
      h += `<p class="label">Дальше в тетради</p><div class="upcoming">` +
        C.upcoming.map(u => `<div class="up"><b>${esc(u.title)}</b><span>${esc(u.gloss)}</span></div>`).join("") + `</div>`;
    }
    h += `<div class="foot"><button class="linkbtn" id="reset">Сбросить прогресс</button></div>`;
    $app.innerHTML = h;
    $app.querySelectorAll("[data-lesson]").forEach(b => b.onclick = () => openRule(findLesson(b.dataset.lesson)));
    document.getElementById("rev").onclick = startRevision;
    document.getElementById("reset").onclick = confirmReset;
    window.scrollTo(0, 0);
  }
  const findLesson = id => { for (const s of C.sections) for (const l of s.lessons) if (l.id === id) return l; };

  function confirmReset() {
    showDock("", `<div class="fb-title">Сбросить весь прогресс?</div><div class="fb-body">Баллы, серия и ошибки для повторения удалятся.</div>
      <div class="row2"><button class="big ghost" id="no">Отмена</button><button class="big red" id="yes">Сбросить</button></div>`);
    document.getElementById("no").onclick = hideDock;
    document.getElementById("yes").onclick = () => { S = blank(); save(); home(); };
  }

  // ---------- RULE ----------
  function ruleHtml(l) {
    let h = `<div class="page"><h2 class="fr">${esc(l.title)}</h2>`;
    l.rule.forEach(b => {
      if (b.t === "text") h += `<div class="blk">${b.ru}</div>`;
      if (b.t === "note") h += `<div class="blk hand">${esc(b.ru)}</div>`;
      if (b.t === "ex") h += `<div class="blk ex">${sayBtn(b.fr)}<span class="fr">${esc(b.fr)}</span></div>`;
      if (b.t === "conj") h += `<div class="conj">` + b.rows.map(r => r.map(f => `<div>${sayBtn(f)}<span class="fr">${esc(f)}</span></div>`).join("")).join("") + `</div>`;
    });
    h += `</div>`;
    if (!("speechSynthesis" in window)) h += `<p class="warn">Этот браузер не поддерживает озвучку — задания на слух будут без звука.</p>`;
    return h;
  }
  function openRule(l) {
    $app.innerHTML = `<div class="lesson-top"><button class="iconbtn" id="x" aria-label="Закрыть">${ICON.close}</button><span class="label" style="margin:0">Правило из конспекта</span></div>` + ruleHtml(l);
    document.getElementById("x").onclick = home;
    showDock("", `<button class="big blue" id="go">Начать упражнения</button>`);
    document.getElementById("go").onclick = () => startSession(l.exercises.map(ex => ({ ex, lesson: l })), { lesson: l });
    window.scrollTo(0, 0);
  }

  // ---------- SESSION ----------
  let R = null; // running session
  function startSession(items, opt) {
    R = { queue: items.map(it => ({ ...it, retry: false })), total: items.length, done: 0, firstOk: 0, xp: 0,
          lesson: opt.lesson || null, revision: !!opt.revision, missed: new Set() };
    next();
  }
  function startRevision() {
    let ids = dueIds().sort((a, b) => S.srs[a].box - S.srs[b].box).slice(0, 10);
    if (!ids.length) {
      const pool = [];
      C.sections.forEach(s => s.lessons.forEach(l => { if (S.lessons[l.id]) l.exercises.forEach(ex => pool.push(ex.id)); }));
      if (!pool.length) {
        $app.innerHTML = `<div class="lesson-top"><button class="iconbtn" id="x" aria-label="Закрыть">${ICON.close}</button></div>
          <div class="empty"><h2>Пока нечего повторять</h2><p>Пройди хотя бы один урок. Задания с ошибками будут появляться здесь.</p></div>`;
        document.getElementById("x").onclick = home; hideDock(); return;
      }
      ids = shuffle(pool).slice(0, 8);
    }
    startSession(ids.map(id => EX[id]), { revision: true });
  }

  function next() {
    if (!R.queue.length) return finish();
    const it = R.queue[0];
    const pct = R.done / R.total * 100;
    const ex = it.ex;
    const ruBig = /[а-яё]/i.test(ex.prompt) && !ex.audio;
    let h = `<div class="lesson-top"><button class="iconbtn" id="x" aria-label="Выйти">${ICON.close}</button>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <button class="iconbtn" id="rule" aria-label="Правило">${ICON.book}</button></div>
      <span class="kind">${esc(ex.kind)}${it.retry ? " · ещё раз" : ""}</span>`;
    if (ex.audio) h += `<div class="audio-row"><button class="play" data-say="${esc(ex.audio)}">${ICON.speak}Слушать</button>
      <button class="play slow" data-say="${esc(ex.audio)}" data-slow="1">Медленно</button></div>`;
    h += `<div class="prompt ${ruBig || ex.type === "match" || ex.type === "find" || ex.type === "order" ? "ru" : "fr"}">${esc(ex.prompt)}</div><div id="work"></div>`;
    $app.innerHTML = h;
    document.getElementById("x").onclick = () => { window.speechSynthesis && speechSynthesis.cancel(); home(); };
    document.getElementById("rule").onclick = () => peekRule(it.lesson);
    RENDER[ex.type](ex, document.getElementById("work"));
    if (ex.audio) setTimeout(() => speak(ex.audio), 250);
    window.scrollTo(0, 0);
  }

  function peekRule(l) {
    showDock("", `<div style="max-height:55vh;overflow:auto">${ruleHtml(l)}</div><button class="big ghost" id="back">Вернуться к заданию</button>`);
    document.getElementById("back").onclick = () => { hideDock(); next(); };
  }

  function checkDock(enabled, onCheck, label = "Проверить") {
    showDock("", `<button class="big" id="chk" ${enabled ? "" : "disabled"}>${label}</button>`);
    const b = document.getElementById("chk"); b.onclick = onCheck; return b;
  }

  // result: ok (bool), shown answer html, extra note
  function grade(ok, correctHtml, note) {
    const it = R.queue.shift();
    const id = it.ex.id;
    if (ok) {
      touchDay();
      const gain = it.retry ? 5 : 10; S.xp += gain; R.xp += gain;
      if (!it.retry) R.firstOk++;
      R.done++;
      if (R.revision && !R.missed.has(id)) srsRight(id);
    } else {
      srsWrong(id); R.missed.add(id);
      R.queue.push({ ...it, retry: true });
    }
    save();
    const title = ok ? (note ? "Почти!" : "Верно!") : "Не совсем";
    let body = "";
    if (!ok) body += `<div>Правильно: <b class="fr">${correctHtml}</b></div>`;
    if (note) body += `<div>${note}</div>`;
    body += `<div class="why">Почему: ${it.ex.explain}</div>`;
    showDock(ok ? "ok" : "bad", `<div class="fb-title">${title}</div><div class="fb-body">${body}</div>
      <button class="big ${ok ? "" : "red"}" id="nx">Дальше</button>`);
    const nx = document.getElementById("nx"); nx.onclick = () => { hideDock(); next(); }; nx.focus();
  }

  function finish() {
    const pct = R.total ? R.firstOk / R.total : 1;
    if (R.lesson) {
      const prev = S.lessons[R.lesson.id];
      S.lessons[R.lesson.id] = { best: Math.max(pct, prev ? prev.best : 0) };
      S.xp += 20; R.xp += 20;
    }
    save();
    $app.innerHTML = `<div class="result"><span class="kind">${R.revision ? "Révision" : "Урок пройден"}</span>
      <h2>${pct === 1 ? "Parfait !" : pct >= 0.7 ? "Très bien !" : "Bien !"}</h2>
      <div class="tiles"><div class="tile"><b>${Math.round(pct * 100)}%</b><small>с первой попытки</small></div>
      <div class="tile"><b>+${R.xp}</b><small>баллов</small></div></div>
      ${R.missed.size ? `<p>Задания с ошибками (${R.missed.size}) попадут в Révision.</p>` : ""}</div>`;
    showDock("", `<button class="big blue" id="hm">На главную</button>`);
    document.getElementById("hm").onclick = home;
  }

  function showDock(cls, html) { $dock.className = "dock" + (cls ? " " + cls : ""); $dockIn.innerHTML = html; $dock.hidden = false; }
  function hideDock() { $dock.hidden = true; $dockIn.innerHTML = ""; }

  // ---------- exercise renderers ----------
  const RENDER = {
    choice(ex, w) {
      let sel = null;
      w.innerHTML = `<div class="options">` + shuffle(ex.options).map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("") + `</div>`;
      const btns = [...w.querySelectorAll(".opt")];
      const chk = checkDock(false, () => {
        const ok = sel === ex.answer;
        btns.forEach(b => { b.disabled = true; if (b.dataset.o === ex.answer) b.classList.add("ok"); else if (b.dataset.o === sel) b.classList.add("bad"); });
        grade(ok, esc(ex.answer));
      });
      btns.forEach(b => b.onclick = () => { sel = b.dataset.o; btns.forEach(x => x.classList.toggle("sel", x === b)); chk.disabled = false; });
    },

    input(ex, w) {
      w.innerHTML = `<input class="field" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Напиши по-французски">
        <div class="accents">${["é", "è", "ê", "à", "ç", "'"].map(c => `<button data-c="${c}" type="button">${c}</button>`).join("")}</div>`;
      const inp = w.querySelector("#inp");
      w.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
        const p = inp.selectionStart ?? inp.value.length;
        inp.value = inp.value.slice(0, p) + b.dataset.c + inp.value.slice(inp.selectionEnd ?? p);
        inp.focus(); inp.setSelectionRange(p + 1, p + 1); chk.disabled = !inp.value.trim();
      });
      const run = () => {
        if (!inp.value.trim()) return;
        inp.disabled = true;
        const v = inp.value;
        if (ex.answers.some(a => norm(a) === norm(v))) return grade(true);
        if (ex.answers.some(a => bare(a) === bare(v))) return grade(true, null, "Проверь надстрочные знаки: <b class='fr'>" + esc(ex.answers[0]) + "</b>");
        grade(false, esc(ex.answers[0]));
      };
      const chk = checkDock(false, run);
      inp.oninput = () => chk.disabled = !inp.value.trim();
      inp.onkeydown = e => { if (e.key === "Enter") run(); };
      if (!matchMedia("(pointer: coarse)").matches) inp.focus();
    },

    order(ex, w) {
      const answer = ex.tokens.join(" ");
      const bank = shuffle(ex.tokens.map((t, i) => ({ t, i })));
      const picked = [];
      w.innerHTML = `<div class="tray" id="tray"></div><div class="bank" id="bank"></div>`;
      const tray = w.querySelector("#tray"), bk = w.querySelector("#bank");
      const draw = () => {
        tray.innerHTML = picked.map(p => `<button class="tok" data-i="${p.i}">${esc(p.t)}</button>`).join("");
        bk.innerHTML = bank.map(p => `<button class="tok${picked.includes(p) ? " used" : ""}" data-i="${p.i}">${esc(p.t)}</button>`).join("");
        tray.querySelectorAll(".tok").forEach(b => b.onclick = () => { picked.splice(picked.findIndex(p => p.i == b.dataset.i), 1); draw(); });
        bk.querySelectorAll(".tok:not(.used)").forEach(b => b.onclick = () => { speakTok(b.textContent); picked.push(bank.find(p => p.i == b.dataset.i)); draw(); });
        chk.disabled = picked.length !== ex.tokens.length;
      };
      const speakTok = t => speak(t.replace(/[.?!]/g, ""));
      const chk = checkDock(false, () => {
        const got = picked.map(p => p.t).join(" ");
        w.querySelectorAll(".tok").forEach(b => b.disabled = true);
        grade(norm(got) === norm(answer), esc(answer));
      });
      draw();
    },

    find(ex, w) {
      let sel = null;
      w.innerHTML = `<div class="words">` + ex.words.map((t, i) => `<button class="opt" data-i="${i}">${esc(t)}</button>`).join("") + `</div>`;
      const btns = [...w.querySelectorAll(".opt")];
      const chk = checkDock(false, () => {
        btns.forEach(b => { b.disabled = true; if (+b.dataset.i === ex.wrong) b.classList.add("bad"); });
        const fixed = ex.words.map((t, i) => i === ex.wrong ? "<u>" + esc(ex.fix) + "</u>" : esc(t)).join(" ");
        grade(sel === ex.wrong, fixed);
      });
      btns.forEach(b => b.onclick = () => { sel = +b.dataset.i; btns.forEach(x => x.classList.toggle("sel", x === b)); chk.disabled = false; });
    },

    match(ex, w) {
      const left = shuffle(ex.pairs.map(p => p[0])), right = shuffle(ex.pairs.map(p => p[1]));
      const map = Object.fromEntries(ex.pairs);
      let pick = null, errors = 0, matched = 0;
      w.innerHTML = `<div class="match"><div class="col">${left.map(l => `<button class="opt" data-l="${esc(l)}">${esc(l)}</button>`).join("")}</div>
        <div class="col">${right.map(r => `<button class="opt" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>`;
      hideDock();
      w.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
        w.querySelectorAll("[data-l]").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); pick = b;
      });
      w.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
        if (!pick) return;
        if (map[pick.dataset.l] === b.dataset.r) {
          speak(pick.dataset.l + " " + b.dataset.r);
          [pick, b].forEach(x => { x.classList.remove("sel"); x.classList.add("ok"); x.disabled = true; });
          pick = null;
          if (++matched === ex.pairs.length) grade(errors === 0, ex.pairs.map(p => p.join(" ")).join(", "));
        } else {
          errors++;
          [pick, b].forEach(x => { x.classList.remove("shake"); void x.offsetWidth; x.classList.add("shake"); });
        }
      });
    },

    open(ex, w) {
      w.innerHTML = `<textarea class="field" id="inp" placeholder="Твой ответ по-французски" spellcheck="false"></textarea><div id="refs"></div>`;
      const inp = w.querySelector("#inp");
      showDock("", `<button class="big blue" id="show">Сравнить с конспектом</button>`);
      document.getElementById("show").onclick = () => {
        inp.disabled = true;
        w.querySelector("#refs").innerHTML = `<p class="label" style="margin-top:16px">Эталон из конспекта</p><div class="refs">` +
          ex.refs.map(r => `<div class="ref">${sayBtn(r)}<span class="fr">${esc(r)}</span></div>`).join("") + `</div>`;
        showDock("", `<div class="fb-body">Самопроверка: твой ответ совпадает с одним из вариантов?</div>
          <div class="row2"><button class="big ghost" id="no">Нужно повторить</button><button class="big" id="yes">Совпадает</button></div>`);
        document.getElementById("yes").onclick = () => grade(true);
        document.getElementById("no").onclick = () => grade(false, ex.refs.map(esc).join(" / "));
      };
    }
  };

  home();
})();
</script>
